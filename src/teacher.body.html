<div class="wrap">
  <header>
    <div class="eyebrow">ДЭ 09.02.06 · Сетевое и системное администрирование</div>
    <h1>Варианты Модуля 1</h1>
    <p class="lead">Выберите сложность и номер. Генератор составит задание, ключ с баллами, скрипты решения и проверки. Все адреса проверяются, так что каждый вариант решаем.</p>
  </header>
  <section class="desk" aria-label="Выбор варианта">
    <div class="code" id="codeBox"></div>
    <div class="levels" id="levels" role="group" aria-label="Сложность"></div>
    <div class="numbox">
      <div class="stepper">
        <button type="button" id="prevBtn" aria-label="Предыдущий номер">−</button>
        <input id="numIn" inputmode="numeric" aria-label="Номер варианта" value="1">
        <button type="button" id="nextBtn" aria-label="Следующий номер">+</button>
      </div>
      <button type="button" class="btn primary" id="rndBtn"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="5.5" cy="5.5" r="1.1" fill="currentColor"/><circle cx="10.5" cy="10.5" r="1.1" fill="currentColor"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/></svg>Новый вариант</button>
    </div>
    <div class="traprow" id="trapRow" hidden></div>
  </section>
  <nav class="tabs" role="tablist" id="tabs" aria-label="Разделы"></nav>
  <main id="main" class="panel"></main>
</div>
<div id="printArea"></div>
<div class="toast" id="toast" role="status"></div>
