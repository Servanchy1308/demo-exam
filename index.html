<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Задания ДЭ 09.02.06</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
/* Layout: header (title · theme · settings) → one compact toolbar (code · level · traps · random) → three sections; the task itself is a paper sheet */
:root{
  --bg:#eef2f3; --surface:#ffffff; --raise:#f5f8f8; --sunk:#e7eced; --ink:#0f1b1f; --muted:#56686e; --faint:#8a9a9f; --line:#dbe3e5; --line-strong:#c4d0d3;
  --accent:#0a7a70; --accent-soft:#ddf1ee; --accent-ink:#ffffff;
  --paper:#fffefc; --paper-ink:#1b1d1f; --paper-line:#cfd5d6;
  --easy:#2c8a4b; --exam:#2b5fc4; --hard:#c2471f;
  --router:#0a7a70; --server:#b0640f; --client:#6d4fc9;
  --term:#0c1517; --term-ink:#d6e4e6; --term-dim:#6e8489; --term-line:#1c2a2e; --term-str:#e8c07d;
  --warn:#8a5500; --warn-bg:#fff2d9; --err:#b42318; --err-bg:#fdecea; --ok:#0f7f55; --ok-bg:#e3f5ec;
  --shadow:0 1px 2px rgba(15,27,31,.05),0 6px 18px rgba(15,27,31,.06);
  --pop:0 10px 30px rgba(15,27,31,.16);
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --sans:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --doc:"PT Serif","Times New Roman",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1113; --surface:#111b1e; --raise:#162226; --sunk:#0d1618; --ink:#e2ecee; --muted:#93a6ab; --faint:#64777c; --line:#223236; --line-strong:#2f4449;
  --accent:#3fc6b5; --accent-soft:#11302c; --accent-ink:#03201b;
  --paper:#131d20; --paper-ink:#e2e8e9; --paper-line:#2b3a3e;
  --easy:#5fca83; --exam:#81a7ff; --hard:#ff8d63;
  --router:#3fc6b5; --server:#f0a65a; --client:#b49cff;
  --term:#060b0c; --term-ink:#d6e4e6; --term-dim:#6e8489; --term-line:#182427; --term-str:#e8c07d;
  --warn:#f3b65c; --warn-bg:#2a2111; --err:#ff8b80; --err-bg:#2e1614; --ok:#4fd39a; --ok-bg:#11291f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --pop:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1113; --surface:#111b1e; --raise:#162226; --sunk:#0d1618; --ink:#e2ecee; --muted:#93a6ab; --faint:#64777c; --line:#223236; --line-strong:#2f4449;
  --accent:#3fc6b5; --accent-soft:#11302c; --accent-ink:#03201b;
  --paper:#131d20; --paper-ink:#e2e8e9; --paper-line:#2b3a3e;
  --easy:#5fca83; --exam:#81a7ff; --hard:#ff8d63;
  --router:#3fc6b5; --server:#f0a65a; --client:#b49cff;
  --term:#060b0c; --term-ink:#d6e4e6; --term-dim:#6e8489; --term-line:#182427; --term-str:#e8c07d;
  --warn:#f3b65c; --warn-bg:#2a2111; --err:#ff8b80; --err-bg:#2e1614; --ok:#4fd39a; --ok-bg:#11291f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --pop:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;transition:background-color .2s}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code,.mono{font-family:var(--mono)}
svg.i{width:16px;height:16px;flex:none}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,2.6vw,1.6rem);letter-spacing:-.01em;margin:0;text-wrap:balance}
.topacts{display:flex;gap:8px;align-items:center}
.lead{color:var(--muted);margin:0;max-width:70ch}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 13px;font-weight:600;font-size:.86rem;white-space:nowrap;display:inline-flex;gap:7px;align-items:center;justify-content:center;transition:border-color .15s,color .15s,background-color .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--accent);background:var(--raise)}
.btn.icon{padding:8px;width:38px;height:38px}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:.82rem}
.lnk:hover{text-decoration:underline}

/* segmented */
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:8px;font-size:.84rem;font-weight:600;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.seg button .n{font-family:var(--mono);font-size:.7rem;color:var(--faint)}
.seg.theme button{padding:6px 8px}

/* level colors */
.lv-E{--lv:var(--easy)} .lv-X{--lv:var(--exam)} .lv-H{--lv:var(--hard)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--lv,var(--muted))}

/* toolbar */
.toolbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .grow{flex:1 1 0;min-width:0}
.codef{display:flex;align-items:stretch;border:1.5px solid var(--lv);border-radius:12px;overflow:hidden;background:var(--surface)}
.codef button{border:0;background:var(--raise);color:var(--muted);width:34px;font-size:1.15rem;line-height:1}
.codef button:hover{color:var(--ink);background:var(--sunk)}
.codef input{width:7.6em;border:0;border-inline:1px solid var(--line);background:var(--surface);text-align:center;font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.01em;padding:7px 4px;color:var(--lv);text-transform:uppercase}
.codef input:focus{outline:none;background:var(--raise)}
.lvseg button[aria-pressed="true"]{color:var(--lv)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--raise);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
button.pill:hover{filter:brightness(.97)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}

/* dropdown */
.dd{position:relative}
.ddp{position:absolute;z-index:15;top:calc(100% + 6px);left:0;min-width:290px;max-width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:8px;display:flex;flex-direction:column;gap:2px}
.ddi{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;font-size:.86rem;font-weight:500;cursor:pointer}
.ddi:hover{background:var(--raise)}
.ddi input{width:16px;height:16px;accent-color:var(--hard);margin:0}
.ddf{display:flex;gap:14px;padding:8px 8px 4px;border-top:1px solid var(--line);margin-top:4px}

/* section nav */
.nav{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.nav button{background:none;border:0;padding:10px 14px 11px;font-weight:600;font-size:.94rem;color:var(--muted);white-space:nowrap;border-bottom:2.5px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.nav .cnt{font-family:var(--mono);font-size:.7rem;background:var(--raise);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:0 6px}

.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:space-between}
.bar .l,.bar .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint,.bar p{margin:0;color:var(--muted);font-size:.84rem;max-width:72ch}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{font-size:.85rem;padding:8px 12px;border-radius:10px}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.msg.err{background:var(--err-bg);color:var(--err)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0;font-size:1rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 small{font-weight:600;font-size:.76rem;color:var(--muted)}
.card .sub{margin:-6px 0 0;color:var(--muted);font-size:.82rem}
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:1rem}

/* paper sheet */
.sheet{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;box-shadow:var(--shadow);padding:clamp(20px,4.5vw,56px);font-family:var(--doc);font-size:1.02rem;line-height:1.55;max-width:900px;width:100%;margin:0 auto;min-width:0}
.sheet .dochead{display:flex;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;font-family:var(--sans);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--paper-line);padding-bottom:10px;margin-bottom:22px}
.sheet .dochead b{color:var(--paper-ink)}
.sheet h2{font-family:var(--doc);font-size:1.45rem;margin:0 0 6px;text-wrap:balance}
.sheet h3{font-family:var(--doc);font-size:1.08rem;margin:22px 0 8px}
.sheet p{margin:0 0 10px}
.sheet ol.items{padding-left:1.6em;margin:8px 0 0;display:flex;flex-direction:column;gap:14px}
.sheet ol.items>li{padding-left:4px}
.sheet ol.items>li::marker{font-weight:700}
.sheet ul{margin:6px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.sheet b.v{font-family:var(--mono);font-size:.88em;font-weight:600;white-space:nowrap}
.sheet .tblw{overflow-x:auto;margin:8px 0 4px}
.sheet table{border-collapse:collapse;font-size:.92rem;min-width:420px;width:100%}
.sheet th,.sheet td{border:1px solid var(--paper-line);padding:5px 9px;text-align:left;vertical-align:top}
.sheet th{font-weight:700;background:color-mix(in srgb,var(--paper-line) 30%,transparent)}
.sheet .cap{font-size:.86rem;font-style:italic;margin:16px 0 0}
.sheet .note{font-size:.86rem;color:var(--muted);border-top:1px solid var(--paper-line);padding-top:10px;margin-top:22px}
.topo{width:100%;max-width:100%;height:auto;display:block;margin:6px 0 0}
.topo .ln{stroke:var(--muted);stroke-width:1.6;fill:none}
.topo .tn{stroke:var(--accent);stroke-width:2;stroke-dasharray:7 5;fill:none}
.topo .nd{fill:var(--paper);stroke-width:1.6}
.topo .r{stroke:var(--router)} .topo .s{stroke:var(--server)} .topo .c{stroke:var(--client)} .topo .w{stroke:var(--muted)}
.topo text{font-family:var(--sans);fill:var(--paper-ink)}
.topo .nm{font-size:14px;font-weight:700}
.topo .lb{font-size:11.5px;fill:var(--muted);font-family:var(--mono)}
.topo .tl{font-size:12px;fill:var(--accent);font-weight:700}
.topo .cloud{fill:var(--raise);stroke:var(--line);stroke-width:1.4}

/* key */
.who{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:12px;padding:9px 12px 9px 14px;font-size:.9rem}
.keygrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:14px;align-items:start}
@media (max-width:980px){.keygrid{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.score{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1}
.score .big small{font-family:var(--sans);font-size:.85rem;color:var(--muted);font-weight:600}
.meter{flex:1;min-width:140px;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.checks{display:flex;flex-direction:column}
.ck{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.ck:first-child{border-top:0;padding-top:2px}
.ck input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.ck .h{font-weight:700;font-size:.92rem;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.ck .h .num{color:var(--faint);font-family:var(--mono);font-size:.78rem;min-width:1.4em}
.ck .pts{font-family:var(--mono);font-size:.76rem;color:var(--muted);white-space:nowrap;padding-top:2px}
.ck input:checked ~ .h{color:var(--ok)}
.ck .rows{grid-column:2/-1;display:flex;flex-direction:column;gap:5px}
.cr{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:3px 12px;font-size:.8rem;align-items:center}
@media (max-width:640px){.cr{grid-template-columns:minmax(0,1fr)}}
.cr code{font-size:.74rem;background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:3px 8px;word-break:break-word;user-select:all}
.cr .exp{color:var(--muted)}
.cr .exp b{color:var(--ok);font-family:var(--mono);font-weight:600;font-size:.74rem}
.ans{display:flex;flex-direction:column}
.ar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:9px 0;border-top:1px solid var(--line)}
.ar:first-child{border-top:0;padding-top:0}
.ar .an{font-size:.8rem;font-weight:700}
.ar .an i{font-style:normal;color:var(--muted);font-weight:600}
.ar b{font-family:var(--mono);font-size:.86rem;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.ar small{grid-column:1/-1;font-family:var(--mono);font-size:.72rem;color:var(--muted);line-height:1.5}
.ar small em{font-style:normal;color:var(--accent)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.tlist li{display:flex;gap:9px;font-size:.82rem;line-height:1.4}
.tlist li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--hard);margin-top:.5em}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.fold>summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:700;font-size:.95rem;display:flex;justify-content:space-between;gap:10px;align-items:center;border-radius:var(--r)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:hover{background:var(--raise)}
details.fold>summary small{font-weight:500;color:var(--muted);font-size:.8rem;margin-left:auto}
details.fold>summary .chev{transition:transform .15s;color:var(--muted)}
details.fold[open]>summary .chev{transform:rotate(180deg)}
details.fold>.fb{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.tbl{overflow-x:auto}
table.dt{border-collapse:collapse;width:100%;font-size:.85rem}
.dt th,.dt td{text-align:left;padding:7px 12px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.dt th{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.dt td{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.8rem}
.dt td:first-child{font-family:var(--sans);font-weight:700;font-size:.85rem}
.dt tr:last-child td{border-bottom:0}
.dt .act{display:flex;gap:6px;justify-content:flex-end}
.rowbtn{font-size:.78rem;font-weight:600;background:none;border:1px solid var(--line);border-radius:8px;padding:3px 10px;color:var(--accent);font-family:var(--sans)}
.rowbtn:hover{border-color:var(--accent)}
.rowbtn.del{color:var(--muted)}
.rowbtn.del:hover{color:var(--err);border-color:var(--err)}
.lvtag{display:inline-flex;gap:6px;align-items:center;font-family:var(--sans);font-weight:700}

/* solve */
.mlist{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:1100px){.mlist{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.mlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mc{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mc:hover{border-color:var(--line-strong)}
.mc[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.mc .top2{display:flex;align-items:center;gap:8px;min-width:0}
.mc .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none}
.mc .ic svg{width:14px;height:14px}
.mc.router .ic{background:color-mix(in srgb,var(--router) 14%,transparent);color:var(--router)}
.mc.server .ic{background:color-mix(in srgb,var(--server) 14%,transparent);color:var(--server)}
.mc.client .ic{background:color-mix(in srgb,var(--client) 14%,transparent);color:var(--client)}
.mc .nm{font-weight:700;font-size:.92rem}
.mc .ip{font-family:var(--mono);font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .steps{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.64rem;font-weight:600;background:var(--raise);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:0 7px}
.mc[aria-pressed="true"] .chip{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.viewer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.vh{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px 16px}
.vh h2{margin:0;font-size:1.12rem}
.vh p{margin:2px 0 0;color:var(--muted);font-size:.84rem}
.send{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:.82rem;color:var(--muted)}
.send code{font-size:.76rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px 8px;word-break:break-all;user-select:all}
.send details{width:100%}
.send summary{cursor:pointer;color:var(--accent);font-weight:600;width:max-content}

<script>
(function(){
// ===== shared: used by the teacher page and the student page =====
const $ = s => document.querySelector(s);
const framed = (function(){ try { return window.self !== window.top } catch(e){ return true } })();

// ---------- IP math ----------
function ip2n(s){ const p=String(s).trim().split('.'); if(p.length!==4) return null; let n=0;
  for(const x of p){ if(!/^\d{1,3}$/.test(x)||+x>255) return null; n=n*256+(+x) } return n }
function n2ip(n){ return [n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.') }
function maskN(p){ return p===0?0:((0xFFFFFFFF<<(32-p))>>>0) }
function mkNet(ipn,p){ const m=maskN(p); const net=(ipn&m)>>>0; const size=Math.pow(2,32-p);

function prefixFor(n,rule){ n=+n; if(!(n>=4)) return null;
  let k = rule==='le' ? Math.floor(Math.log2(n)) : Math.ceil(Math.log2(n)); if(k<2) k=2; if(k>24) return null; return 32-k }
function isPrivate(n){ return (n>>>24)===10 || ((n>>>24)===172 && ((n>>>16)&255)>=16 && ((n>>>16)&255)<=31) || ((n>>>24)===192 && ((n>>>16)&255)===168) }

// ---------- reference data ----------
const LEVELS={
  E:{name:'Лёгкий',desc:'Как в демоверсии: ровные маски, стандартные логины и порты'},
  X:{name:'Экзамен',desc:'Случайные адреса, VLAN, порты, пароли и часовой пояс'},

// ---------- variant codes ----------
function parseCode(s){ const m=/^([EXH])-(\d{1,4})(?:\.(\d{1,3}))?$/.exec(String(s||'').trim().toUpperCase().replace(/^#/,''));
  if(!m) return null; const mask = m[1]==='H' ? (m[3]!=null ? Math.min(ALLTRAPS,+m[3]) : ALLTRAPS) : ALLTRAPS;
  return {lv:m[1],num:Math.max(1,+m[2]),mask} }
const codeOf = c => c.lv+'-'+c.num+(c.lv==='H'&&c.mask!=null&&c.mask!==ALLTRAPS?'.'+c.mask:'');

// ---------- group links: variant derived from the student's name ----------
// token: g.<level><mask?>.<seed>, e.g. g.X.k7f3q or g.H300.k7f3q
function parseGroup(s){ const m=/^#?g\.([EXH])(\d{1,3})?\.([a-z0-9]{4,10})$/i.exec(String(s||'').trim());
  if(!m) return null; const lv=m[1].toUpperCase(); return {lv, mask: lv==='H' ? (m[2]!=null?Math.min(ALLTRAPS,+m[2]):ALLTRAPS) : ALLTRAPS, seed:m[3].toLowerCase()} }
const groupToken = g => 'g.'+g.lv+(g.lv==='H'&&g.mask!==ALLTRAPS?g.mask:'')+'.'+g.seed;
function newSeed(){ let s=''; const a='abcdefghijkmnpqrstuvwxyz23456789'; for(let i=0;i<6;i++) s+=a[Math.floor(Math.random()*a.length)]; return s }
function normName(n){ return String(n||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9\s-]/g,' ').split(/\s+/).filter(Boolean).sort().join(' ') }
function nameOk(n){ return String(n||'').trim().split(/\s+/).filter(w=>/[A-Za-zА-Яа-яЁё]{2,}/.test(w)).length>=2 }
function codeForName(g,name){ let h=2166136261>>>0; const s=g.seed+'|'+normName(name); for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0 }
  return codeOf({lv:g.lv,num:1+(h%9999),mask:g.lv==='H'?g.mask:ALLTRAPS}) }
const prettyName = n => String(n||'').replace(/[*{}<>]/g,'').trim().replace(/\s+/g,' ').split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');

// ---------- seeded variants ----------
function rngFor(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0 }
  let a=h; return function(){ a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296 } }
function build(lv,num,att,mask){
  if(mask==null) mask=ALLTRAPS;
  const rnd=rngFor(lv+'-'+num+(att?'/'+att:''));
  const int=(a,b)=>a+Math.floor(rnd()*(b-a+1)), pick=a=>a[Math.floor(rnd()*a.length)];
  const distinct=(n,f)=>{ const s=new Set(); let g=0; while(s.size<n&&g++<500) s.add(f()); return [...s] };
  const T = key => lv==='H' && !!(mask & (1<<TRAPS.findIndex(t=>t[0]===key)));
  const c={lv,num:+num,mask:lv==='H'?mask:ALLTRAPS,addrMode:'given',block:''};
  const K = lv==='E'?{srv:pick([5,6]),cli:pick([4,5]),mgmt:3,br:pick([4,5])}
    : lv==='X'?{srv:pick([5,6,7]),cli:pick([4,5,6]),mgmt:pick([3,4]),br:pick([4,5,6])}
    : {srv:pick([5,6]),cli:pick([4,5,6]),mgmt:pick([3,4]),br:pick([4,5,6])};
  const ER={srv:'le',cli:'ge',mgmt:'le',br:'le'};
  for(const k in K){ const e=K[k], rule = lv==='E'?ER[k]:pick(['le','ge']); c[k+'Rule']=rule;
    c[k+'N']=String(T('odd') ? (rule==='le' ? 2**e+int(1,2**e-1) : int(2**(e-1)+1,2**e-1)) : 2**e) }
  let v; if(lv==='E'){ const a=int(1,4); v=[a*100,a*100+100,999] } else if(lv==='X') v=distinct(3,()=>int(100,899)); else v=distinct(3,()=>int(2,4094));
  [c.srvVid,c.cliVid,c.mgmtVid]=v.map(String);
  if(T('vlsm')){ c.addrMode='vlsm'; const f=pick([0,1,2]);
    c.block = f===0 ? '10.'+int(1,254)+'.'+int(0,255)+'.0/24' : f===1 ? '172.'+int(17,31)+'.'+int(0,255)+'.0/24' : '192.168.'+int(1,254)+'.0/24' }
  else { const fam = lv!=='E'&&rnd()<.3 ? '10.'+int(1,254)+'.' : '192.168.';
    const th = lv==='E' ? distinct(4,()=>int(1,25)*10) : distinct(4,()=>int(1,254));
    ['srv','cli','mgmt','br'].forEach((k,i)=>c[k+'Base']=fam+th[i]+'.0') }
  if(lv==='E'){ const x=int(1,8); c.netIspHq='172.16.'+x+'.0/28'; c.netIspBr='172.16.'+(x+1)+'.0/28' }
  else { const p=T('m29')?29:28, sz=2**(32-p), off=()=>T('off')?int(1,256/sz-1)*sz:0; const [a,b]=distinct(2,()=>int(1,250));
    c.netIspHq='172.16.'+a+'.'+off()+'/'+p; c.netIspBr='172.16.'+b+'.'+off()+'/'+p }
  if(lv==='E'){ c.netTun=pick(['10.10.10.0/30','10.5.5.0/30','10.0.0.0/30']); c.tun='gre' }
  else { const p=T('m29')?29:30, sz=2**(32-p); const pre=rnd()<.6?'10.'+int(0,255)+'.'+int(0,255):'192.168.255';
    c.netTun=pre+'.'+(T('off')?int(1,256/sz-1)*sz:0)+'/'+p;
    c.tun = lv==='X' ? pick(['gre','gre','ipip']) : (T('ipip')?'ipip':'gre') }
  const tzs=Object.keys(TZ);
  if(lv==='E') Object.assign(c,{adm:'net_admin',admPass:'P@$$word',su:'sshuser',suPass:'P@ssw0rd',uid:'1010',sshPort:'2024',maxTries:'2',
    banner:'Authorized access only',ospfPass:'P@ssw0rd',dom:'au-team.irpo',tz:'Europe/Moscow',fwd1:'77.88.8.8',fwd2:'77.88.8.1',dockerTo:'hq'});
  else { const d=pick(DNSP);
    Object.assign(c,{adm:T('login')?pick(ADM):'net_admin',admPass:pick(PASS),su:T('login')?pick(SU):'sshuser',suPass:pick(PASS),
      uid:String(lv==='H'?int(1100,4999):int(1010,2099)),
      sshPort:String(T('ssh')?pick([int(2200,2999),int(4000,4999),int(6100,6999)]):int(2020,2099)),
      maxTries:String(T('ssh')?int(3,5):pick([2,3])),banner:pick(BANNERS),ospfPass:pick(OSPFP),
      dom:T('dom')?pick(DOMS):'au-team.irpo',tz:pick(tzs),fwd1:d[0],fwd2:d[1],
      dockerTo: lv==='X' ? pick(['hq','br']) : (T('docker')?'br':'hq')}) }

}
function fillBases(c,r){ LANS.forEach(([k])=>{ if(r.lans[k]) c[k+'Base']=n2ip(r.lans[k].net) }) }
function makeVariant(lv,num,mask){
  for(let a=0;a<40;a++){ const c=build(lv,num,a,mask), r=compute(c); if(r.ok){ if(c.addrMode==='vlsm') fillBases(c,r); return c } }
  return build('E',1,0);
}
const variantFromCode = code => { const p=parseCode(code); return p ? makeVariant(p.lv,p.num,p.mask) : null };

// ---------- compute ----------
function compute(c){
  const W=[], E=[];
  const ispHq=parseCidr(c.netIspHq), ispBr=parseCidr(c.netIspBr), tun=parseCidr(c.netTun);
  if(!ispHq) E.push('Сеть ISP — HQ-RTR задана неверно. Формат: 172.16.4.0/28');
  if(!ispBr) E.push('Сеть ISP — BR-RTR задана неверно. Формат: 172.16.5.0/28');
  if(!tun) E.push('Сеть туннеля задана неверно. Формат: 10.10.10.0/30');
  [['ISP — HQ-RTR',ispHq],['ISP — BR-RTR',ispBr],['туннеля',tun]].forEach(([n,x])=>{ if(x&&!x.aligned) W.push('Адрес сети '+n+' не на границе /'+x.p+', используется '+x.cidr) });
  const lans={}, pre={};
  LANS.forEach(([k,name])=>{ const p=prefixFor(c[k+'N'],c[k+'Rule']); if(p===null) E.push(name+': число адресов должно быть от 4'); else pre[k]=p });
  let block=null;
  if(c.addrMode==='vlsm'){
    block=parseCidr(c.block);
    if(!block) E.push('Общий блок задан неверно. Формат: 10.20.30.0/24');
    else if(Object.keys(pre).length===4){
      if(!block.aligned) W.push('Блок выровнен до '+block.cidr);
      const order=LANS.map(([k],i)=>({k,i,p:pre[k]})).sort((a,b)=>a.p-b.p||a.i-b.i);
      let cur=block.net;
      order.forEach(o=>{ const size=2**(32-o.p); cur=Math.ceil(cur/size)*size; lans[o.k]=mkNet(cur,o.p); cur+=size });
      if(cur-1>block.bc) E.push('Сети не помещаются в блок '+block.cidr+': нужно '+(cur-block.net)+' адресов из '+block.size);
    }
  } else {
    LANS.forEach(([k,name])=>{ if(pre[k]==null) return; const base=ip2n(c[k+'Base']);
      if(base===null){ E.push(name+': адрес сети задан неверно'); return }
      const net=mkNet(base,pre[k]); lans[k]=net; if(!net.aligned) W.push(name+': адрес не на границе /'+net.p+', используется '+net.cidr) });
  }
  LANS.forEach(([k,name])=>{ const n=lans[k]; if(n&&!isPrivate(n.net)) W.push(name+': сеть '+n.cidr+' не из частного диапазона RFC 1918') });
  if(lans.cli && lans.cli.size<8) E.push('HQ-CLI: в сети меньше 8 адресов, диапазону DHCP не хватит места');
  const all=[['ISP — HQ-RTR',ispHq],['ISP — BR-RTR',ispBr],['туннель',tun],['HQ-SRV',lans.srv],['HQ-CLI',lans.cli],['управление',lans.mgmt],['BR-SRV',lans.br]].filter(x=>x[1]);
  for(let i=0;i<all.length;i++) for(let j=i+1;j<all.length;j++){ const a=all[i][1],b=all[j][1];
    if(a.net<=b.bc && b.net<=a.bc) E.push('Сети «'+all[i][0]+'» и «'+all[j][0]+'» пересекаются') }
  const vids=[c.srvVid,c.cliVid,c.mgmtVid];
  vids.forEach(v=>{ if(!(/^\d+$/.test(v)&&+v>=1&&+v<=4094)) E.push('VLAN '+v+': номер должен быть от 1 до 4094') });
  if(new Set(vids).size<3) E.push('Номера VLAN должны различаться');
  [['adm','Логин на роутерах'],['su','Логин на серверах'],['admPass','Пароль на роутерах'],['suPass','Пароль на серверах'],['ospfPass','Пароль OSPF'],['dom','Домен'],['banner','Баннер']]
    .forEach(([k,n])=>{ if(!String(c[k]||'').trim()) E.push(n+': поле пустое') });
  if(/['"`\\]/.test(c.admPass+c.suPass+c.ospfPass)) E.push('Пароли не должны содержать кавычки и обратную косую черту');
  if(/['"`\\$]/.test(c.banner)) E.push('Баннер не должен содержать кавычки, $ и обратную косую черту');
  if(String(c.ospfPass).length>16) E.push('Пароль OSPF (MD5) не длиннее 16 символов');
  if(!/^[a-z_][a-z0-9_-]*$/.test(c.adm)||!/^[a-z_][a-z0-9_-]*$/.test(c.su)) E.push('Логины: только маленькие латинские буквы, цифры, _ и -');
  if(!(+c.sshPort>=1&&+c.sshPort<=65535)) E.push('Порт SSH должен быть от 1 до 65535');
  if(!(/^\d+$/.test(c.uid)&&+c.uid>=1000&&+c.uid<=60000)) E.push('UID должен быть числом от 1000 до 60000');
  if(!(+c.maxTries>=1&&+c.maxTries<=10)) E.push('Число попыток входа: от 1 до 10');
  if(/[^\x00-\x7F]/.test([c.adm,c.su,c.admPass,c.suPass,c.ospfPass,c.banner,c.dom].join(''))) W.push('В логинах, паролях, баннере или домене есть русские буквы. VirtualBox печатает только латиницу.');
  const ok=!!(ispHq&&ispBr&&tun&&lans.srv&&lans.cli&&lans.mgmt&&lans.br)&&E.length===0;
  return {W,E,ok,ispHq,ispBr,tun,lans,pre,block};
}
function addrs(c,r){
  const {ispHq,ispBr,tun,lans}=r; const s=lans.srv, cl=lans.cli, m=lans.mgmt, b=lans.br;
  const A={ ispHq:ispHq.h(1), hqWan:ispHq.h(2), ispBr:ispBr.h(1), brWan:ispBr.h(2), tHq:tun.h(1), tBr:tun.h(2),
    hqSrvGw:s.h(1), hqSrv:s.h(2), hqCliGw:cl.h(1), hqCli:cl.h(2), hqMg:m.h(1), brGw:b.h(1), brSrv:b.h(2),

function runsOf(x){ return String(x).split(/(\*\*[^*]+\*\*|\{\{[^}]+\}\})/).filter(Boolean).map(p=>
  p.startsWith('**')?{b:1,t:p.slice(2,-2)}:p.startsWith('{{')?{m:1,t:p.slice(2,-2)}:{t:p}) }
function mdHtml(x){ return runsOf(x).map(r=>r.b?'<b>'+esc(r.t)+'</b>':r.m?'<b class="v">'+esc(r.t)+'</b>':esc(r.t)).join('') }
function modelHtml(M){
  const tbl=b=>'<div class="tblw"><table border="1" cellpadding="4" style="border-collapse:collapse"><thead><tr>'+b.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map(x=>'<td>'+mdHtml(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  return M.map(b=>{
    if(b.t==='meta') return '<div class="dochead"><span>'+mdHtml(b.l)+'</span><span>'+mdHtml(b.r)+'</span></div>';
    if(b.t==='h1') return '<h2>'+mdHtml(b.x)+'</h2>';
    if(b.t==='h2') return '<h3>'+mdHtml(b.x)+'</h3>';
    if(b.t==='p') return '<p>'+mdHtml(b.x)+'</p>';
    if(b.t==='cap') return '<p class="cap">'+mdHtml(b.x)+'</p>';
    if(b.t==='note') return '<p class="note">'+mdHtml(b.x)+'</p>';
    if(b.t==='img') return b.svg;
    if(b.t==='table') return tbl(b);
    if(b.t==='ol') return '<ol class="items">'+b.items.map(i=>'<li>'+mdHtml(i.x)+(i.sub?'<ul>'+i.sub.map(s=>'<li>'+mdHtml(s)+'</li>').join('')+'</ul>':'')+'</li>').join('')+'</ol>';
    return '';
  }).join('\n');
}
function modelText(M){
  const pl=x=>runsOf(x).map(r=>r.t).join('');
  return M.map(b=>{
    if(b.t==='meta') return pl(b.l)+'   '+pl(b.r)+'\n';
    if(b.t==='img') return '[Рисунок: топология сети]';
    if(b.t==='table') return [b.head.join(' | ')].concat(b.rows.map(r=>r.map(pl).join(' | '))).join('\n')+'\n';
    if(b.t==='ol') return b.items.map((i,n)=>(n+1)+'. '+pl(i.x)+(i.sub?'\n'+i.sub.map(s=>'   – '+pl(s)).join('\n'):'')).join('\n')+'\n';
    return pl(b.x)+(b.t==='h1'||b.t==='h2'?'\n':'');
  }).join('\n');
}

const xe = s => String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function svgToPng(svg,w,h){ return new Promise(res=>{ try{ const img=new Image();
  img.onload=()=>{ try{ const cv=document.createElement('canvas'); cv.width=w*2; cv.height=h*2; const x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,cv.width,cv.height); x.drawImage(img,0,0,cv.width,cv.height); cv.toBlob(b=>res(b),'image/png') }catch(e){ res(null) } };
  img.onerror=()=>res(null); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg) }catch(e){ res(null) } }) }
function dRun(r,o){ o=o||{}; const sz=o.sz||24, mono=r.m;
  const f = mono ? 'Consolas' : 'Times New Roman';
  return '<w:r><w:rPr><w:rFonts w:ascii="'+f+'" w:hAnsi="'+f+'" w:cs="'+f+'"/>'+((r.b||mono||o.b)?'<w:b/>':'')+(o.i?'<w:i/>':'')+(o.color?'<w:color w:val="'+o.color+'"/>':'')+'<w:sz w:val="'+(mono?sz-2:sz)+'"/></w:rPr><w:t xml:space="preserve">'+xe(r.t)+'</w:t></w:r>' }
function dPara(x,o){ o=o||{};
  const pPr='<w:pPr><w:spacing w:after="'+(o.after??120)+'" w:before="'+(o.before??0)+'"/>'+(o.ind?'<w:ind w:left="'+o.ind+'" w:hanging="'+(o.hang||0)+'"/>':'')+(o.jc?'<w:jc w:val="'+o.jc+'"/>':'')+(o.keep?'<w:keepNext/>':'')+'</w:pPr>';
  return '<w:p>'+pPr+(o.prefix?dRun({t:o.prefix},o):'')+runsOf(x).map(r=>dRun(r,o)).join('')+'</w:p>' }
function dTable(b){
  const n=b.head.length, w=Math.floor(9638/n), bd='w:val="single" w:sz="4" w:space="0" w:color="808080"';
  const cell=(x,h)=>'<w:tc><w:tcPr><w:tcW w:w="'+w+'" w:type="dxa"/>'+(h?'<w:shd w:val="clear" w:color="auto" w:fill="EDEFF0"/>':'')+'</w:tcPr>'+dPara(x,{after:0,sz:22,b:h})+'</w:tc>';

}

// docs: array of models; plain text pages may be passed as {lines:[...]} for keys
async function buildDocx(docs){
  if(!window.JSZip) throw new Error('Архиватор не загрузился');
  const z=new JSZip(); let body='', rels='', img=0;
  for(let i=0;i<docs.length;i++){
    if(i) body+='<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
    const M=docs[i];
    if(M.lines){ M.lines.forEach(l=>body+=dPara(l,{after:0,sz:20})); continue }
    for(const b of M){
      if(b.t==='meta') body+=dPara(b.l+'   ·   '+b.r,{sz:18,color:'56686E',after:240});
      else if(b.t==='h1') body+=dPara('**'+b.x+'**',{sz:32,after:160});
      else if(b.t==='h2') body+=dPara('**'+b.x+'**',{sz:26,before:200,after:120,keep:1});
      else if(b.t==='p') body+=dPara(b.x);
      else if(b.t==='cap') body+=dPara(b.x,{i:1,sz:22,before:120,after:60,keep:1});
      else if(b.t==='note') body+=dPara(b.x,{sz:20,before:200,color:'56686E'});
      else if(b.t==='table') body+=dTable(b);
      else if(b.t==='ol') b.items.forEach((it,n)=>{ body+=dPara(it.x,{ind:360,hang:360,prefix:(n+1)+'. ',after:it.sub?40:140});
        (it.sub||[]).forEach((s,k,arr)=>body+=dPara(s,{ind:720,hang:280,prefix:'– ',after:k===arr.length-1?140:40})) });
      else if(b.t==='img'){ const png=await svgToPng(b.svgx,760,410);
        if(png){ img++; z.file('word/media/topo'+img+'.png',png);
          rels+='<Relationship Id="rImg'+img+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/topo'+img+'.png"/>';
          body+=dImage(img,5760720,Math.round(5760720*410/760)) } }
    }
  }
  z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  z.file('word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels+'</Relationships>');
  z.file('word/document.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>'+
    body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>');
  return z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

// ---------- exam timer: hidden → 15 min reading → module time; survives reload ----------
// phases: idle (task hidden), read, work, pause, done
function mountExam(el,o){
  const K='degen.exam.v1.m'+o.mod, RD=o.read*60000, WD=o.work*60000;
  const fresh=()=>({phase:'idle',endAt:null,left:WD,warned:false});
  let T=Object.assign(fresh(),store.get(K,{})), iv=null, armed=0, ac=null;
  const left=()=>T.endAt?Math.max(0,T.endAt-Date.now()):T.left;
  const fmtT=ms=>{ const s=Math.ceil(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0') };
  const durTxt=ms=>{ const m=Math.round(ms/60000); return m%60?(m>=60?Math.floor(m/60)+' ч '+m%60+' мин':m+' мин'):(m/60)+' ч' };
  const beep=n=>{ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); for(let i=0;i<n;i++){ const os=ac.createOscillator(), g=ac.createGain(), t0=ac.currentTime+i*.45;
    os.frequency.value=880; g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.25,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+.35); os.connect(g).connect(ac.destination); os.start(t0); os.stop(t0+.4) } }catch(e){} };
  const baseTitle=document.title.replace(/^(⏱ [^·]+· |Время вышло · )/,'');
  el.innerHTML='<div class="timer" id="tmBox" role="timer" aria-label="Таймер экзамена"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 6v3l2 1.5M6.5 1.8h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'+
    '<span class="tph" id="tmP"></span><b class="tm" id="tmT"></b><button type="button" class="tb primary" id="tmGo"></button><button type="button" class="tb" id="tmRs">Сброс</button></div>';
  const box=el.querySelector('#tmBox'), pEl=el.querySelector('#tmP'), tEl=el.querySelector('#tmT'), go=el.querySelector('#tmGo'), rs=el.querySelector('#tmRs');
  const save=()=>store.set(K,T); let last=null;
  const emit=()=>{ if(last!==T.phase){ last=T.phase; o.onPhase&&o.onPhase(T.phase) } };
  function toWork(){ T.phase='work'; T.left=WD; T.endAt=Date.now()+WD; T.warned=false; save(); beep(2); toast('Ознакомление окончено. На '+o.label+' — '+durTxt(WD)) }
  function draw(){ let l=left();
    if(T.phase==='read'&&l<=0){ toWork(); l=left() }
    if(T.phase==='work'&&l<=0){ T.phase='done'; T.left=0; T.endAt=null; save(); stop(); beep(3); toast('Время на '+o.label+' вышло') }
    if(T.phase==='work'&&!T.warned&&l<=600000&&WD>600000){ T.warned=true; save(); beep(1); toast('Осталось 10 минут') }
    const ph=T.phase;
    pEl.textContent={idle:'',read:'Ознакомление',work:'',pause:'Пауза',done:'Время вышло'}[ph];
    tEl.textContent=ph==='idle'?durTxt(RD)+' + '+durTxt(WD):ph==='done'?'00:00':fmtT(l);
    box.dataset.st=ph+(ph==='work'&&l<=600000?' warn':'')+(ph==='read'||ph==='work'?' run':'');
    go.textContent={idle:'Начать',read:'Приступить',work:'Пауза',pause:'Дальше',done:'Заново'}[ph];
    go.title=ph==='read'?'Закончить ознакомление и запустить '+durTxt(WD):'';
    rs.hidden=ph==='idle';
    document.title=(ph==='read'||ph==='work')?'⏱ '+fmtT(l)+' · '+baseTitle:(ph==='done'?'Время вышло · '+baseTitle:baseTitle);
    emit() }
  function stop(){ clearInterval(iv); iv=null }
  function tick(){ stop(); iv=setInterval(draw,500) }
  go.addEventListener('click',()=>{ const ph=T.phase;
    if(ph==='idle'||ph==='done'){ T=fresh(); T.phase='read'; T.endAt=Date.now()+RD; tick(); toast('Ознакомление: '+durTxt(RD)+', затем '+durTxt(WD)+' на выполнение') }
    else if(ph==='read'){ toWork(); tick() }
    else if(ph==='work'){ T.left=left(); T.endAt=null; T.phase='pause'; stop() }
    else if(ph==='pause'){ T.endAt=Date.now()+T.left; T.phase='work'; tick() }
    save(); draw() });
  rs.addEventListener('click',()=>{
    if(T.phase!=='done'&&Date.now()-armed>3000){ armed=Date.now(); toast('Нажмите «Сброс» ещё раз: таймер обнулится, задание скроется'); return }
    stop(); T=fresh(); save(); draw(); toast('Таймер сброшен') });
  if(T.phase==='read'||T.phase==='work') tick(); draw();
  return { start(){ if(T.phase==='idle'||T.phase==='done') go.click() }, phase:()=>T.phase, stop };
}

let EX=null;
function mountEx(){ if(EX) EX.stop(); EX=mountExam($('#timerBox'),{mod:S.mod,read:READ_MIN,work:MODS[S.mod].min,label:MODS[S.mod].name,onPhase:()=>renderSheet()}) }
function load(lv,num,mask){ S.lv=lv; S.num=Math.max(1,Math.min(9999,parseInt(num,10)||1)); S.mask=lv==='H'?(mask==null?ALLTRAPS:mask):ALLTRAPS; store.set(KEY,S);
  if(!GRP){ try{ history.replaceState(null,'','#'+codeOf({lv:S.lv,num:S.num,mask:S.mask})) }catch(e){} } render() }
const osPick=()=>'<div class="ef"><label for="osSel" style="font-weight:600;font-size:.8rem;color:var(--muted)">ОС роутеров</label><select id="osSel" style="width:auto"><option value="astra">Astra Linux CE</option><option value="alt">Альт Сервер</option></select></div>';
function wireOs(){ $('#osSel').value=S.os; $('#osSel').addEventListener('change',ev=>{ S.os=ev.target.value; store.set(KEY,S); render() }) }

// group link: the student types their name and gets a personal variant
function renderGroupEntry(){
  const e=$('#entry');
  if(!ME){
    e.innerHTML='<div class="hello"><b>Здравствуйте! Введите фамилию и имя</b><span>По ним выдаётся личный вариант уровня «'+esc(LEVELS[GRP.lv].name)+'». Пишите так же, как в журнале группы.</span></div>'+
      '<form class="ef" id="nameForm" style="flex:1 1 360px"><label class="sr" for="nameIn">Фамилия и имя</label><input id="nameIn" placeholder="Иванов Иван" autocomplete="name" spellcheck="false" style="flex:1;min-width:200px;font-size:1rem;padding:10px 12px"><button type="submit" class="btn primary">Получить вариант</button></form>';
    $('#nameForm').addEventListener('submit',ev=>{ ev.preventDefault(); const v=$('#nameIn').value;
      if(!nameOk(v)){ toast('Нужны фамилия и имя, например: Иванов Иван'); $('#nameIn').focus(); return }
      ME={name:prettyName(v)}; store.set(KEY+'.g.'+GRP.seed,ME); render(); toast('Ваш вариант: '+codeForName(GRP,ME.name)) });
    return;
  }
  e.innerHTML='<div class="badge lv-'+C.lv+'"><span class="led"></span><span class="bc"><small>Ваш вариант</small><b>'+esc(codeOf(C))+'</b></span></div>'+
    '<div class="hello"><b>'+esc(ME.name)+'</b><span>Вариант закреплён за вами. Назовите код преподавателю.</span></div>'+
    osPick()+'<button type="button" class="btn ghost" id="notMe">Изменить ФИ</button>';
  wireOs();
  $('#notMe').addEventListener('click',()=>{ ME=null; try{ localStorage.removeItem(KEY+'.g.'+GRP.seed) }catch(err){} render(); setTimeout(()=>{ const n=$('#nameIn'); if(n) n.focus() },0) });
}
function renderEntry(){
  const e=$('#entry'), dd = S.train && C.lv==='H' ? trapsDD(S.mask,m=>load('H',S.num,m)) : null;
  e.innerHTML='<div class="badge lv-'+C.lv+'"><span class="led"></span><span class="bc"><small>Вариант</small><b>'+esc(codeOf(C))+'</b></span></div>'+
    '<div class="ef"><label class="sr" for="codeIn">Код варианта от преподавателя</label><input id="codeIn" class="bigin" placeholder="X-12" spellcheck="false" autocomplete="off"><button type="button" class="btn primary" id="codeGo">Открыть</button></div>'+
    '<span class="hint" style="flex:1 1 220px">Введите код от преподавателя, например X-12, или откройте ссылку группы.</span>'+
    osPick()+'<button type="button" class="btn ghost" id="trainBtn" aria-expanded="'+S.train+'">'+(S.train?'Скрыть тренировку':'Тренироваться самому')+'</button>'+
    (S.train?'<div class="train"><div class="seg" role="group" aria-label="Сложность">'+Object.entries(LEVELS).map(([k,v])=>'<button type="button" class="lv-'+k+'" data-lv="'+k+'" aria-pressed="'+(C.lv===k)+'" title="'+esc(v.desc)+'"><span class="dot"></span>'+v.name+'</button>').join('')+'</div>'+
      '<div class="codef lv-'+C.lv+'"><button type="button" id="prevBtn" aria-label="Предыдущий номер">‹</button><input id="numIn" inputmode="numeric" aria-label="Номер варианта" value="'+S.num+'" style="font-family:var(--mono);font-size:.95rem;width:5em"><button type="button" id="nextBtn" aria-label="Следующий номер">›</button></div>'+
      (dd?dd.html:'')+'<button type="button" class="btn" id="rndBtn">'+ICON.dice+'Случайный</button><span class="hint">'+esc(LEVELS[C.lv].desc)+'</span></div>':'');
  wireOs();
  const go=()=>{ const v=$('#codeIn').value, g=parseGroup(v.replace(/^.*#/,''));
    if(g){ location.hash=groupToken(g); location.reload(); return }
    const p=parseCode(v); if(!p){ toast('Код выглядит так: X-12, E-3 или H-7'); $('#codeIn').focus(); return } load(p.lv,p.num,p.mask); toast('Открыт вариант '+codeOf(C)) };
  $('#codeGo').addEventListener('click',go);
  $('#codeIn').addEventListener('keydown',ev=>{ if(ev.key==='Enter') go() });
  $('#trainBtn').addEventListener('click',()=>{ S.train=!S.train; store.set(KEY,S); renderEntry() });
  if(S.train){
    if(dd) dd.wire(e);
    e.querySelectorAll('[data-lv]').forEach(b=>b.addEventListener('click',()=>load(b.dataset.lv,S.num,S.mask)));
    $('#prevBtn').addEventListener('click',()=>load(S.lv,S.num-1,S.mask));
    $('#nextBtn').addEventListener('click',()=>load(S.lv,S.num+1,S.mask));
    $('#numIn').addEventListener('change',ev=>load(S.lv,ev.target.value,S.mask));
    $('#rndBtn').addEventListener('click',()=>load(S.lv,1+Math.floor(Math.random()*999),S.mask));
  }
}
function render(){
  if(GRP){
    if(!ME){ C=makeVariant(GRP.lv,1,GRP.mask); R=compute(C); renderGroupEntry();
      $('#main').innerHTML='<div class="empty"><b>Задание появится после ввода ФИ</b>Вариант выдаётся каждому студенту отдельно и не меняется, если открыть ссылку снова.</div>'; return }
    C=withM23(variantFromCode(codeForName(GRP,ME.name))); R=compute(C); renderGroupEntry();
  } else { C=withM23(makeVariant(S.lv,S.num,S.mask)); R=compute(C); renderEntry() }
  renderSheet();
}
const LOCK='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
const durRu = m => m%60 ? (m>60?Math.floor(m/60)+' ч '+(m%60)+' мин':m+' мин') : (m/60)+' ч';
function renderSheet(){
  const main=$('#main'); if(!main||!C||!EX) return;
  if(GRP&&!ME) return;
  const who = GRP&&ME ? ME.name : '', mod=S.mod, ph=EX.phase(), open=ph!=='idle';
  const M = mod===1 ? taskModel(C,R,S.os,who) : taskModel23(mod,C,R,who);
  const seg='<div class="seg modseg" role="group" aria-label="Модуль">'+[1,2,3].map(k=>'<button type="button" data-mod="'+k+'" aria-pressed="'+(mod===k)+'">'+MODS[k].name+' <small>'+durRu(MODS[k].min)+'</small></button>').join('')+'</div>';
  main.innerHTML='<div class="bar"><div class="l" style="display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap">'+seg+'<p>'+(who?'Код варианта <b>'+esc(codeOf(C))+'</b>. ':'')+(open?'Выполните задание на стенде, настройки опишите в отчёте.':'Задание откроется после старта таймера.')+'</p></div>'+
    (open?'<div class="acts"><button type="button" class="btn" id="cpTask">'+ICON.copy+'<span class="lbl">Скопировать для Word</span></button>'+
    (canSave()?'<button type="button" class="btn primary" id="dxTask">'+ICON.down+'<span class="lbl">.docx</span></button>':'')+
    (framed?'':'<button type="button" class="btn" id="prTask">'+ICON.print+'<span class="lbl">Печать</span></button>')+'</div>':'')+'</div>'+
    (open ? (ph==='read'?'<div class="readbanner">Идёт ознакомление: '+READ_MIN+' минут на чтение задания, затем '+durRu(MODS[mod].min)+' на выполнение. Нажмите «Приступить» на таймере, если готовы раньше.</div>':'')+'<article class="sheet" id="sheet">'+modelHtml(M)+'</article>'
      : '<div class="locked"><div class="lk">'+LOCK+'</div><h2>'+MODS[mod].name+'. '+esc(MODS[mod].title)+'</h2><p>Задание скрыто до начала. После старта будет '+READ_MIN+' минут на ознакомление, затем таймер на выполнение запустится сам.</p>'+
        '<div class="steps3"><span>Ознакомление <b>'+READ_MIN+' мин</b></span><span>Выполнение <b>'+durRu(MODS[mod].min)+'</b></span></div><button type="button" class="btn primary" id="startEx">Начать '+MODS[mod].name.toLowerCase().replace('модуль','модуль')+'</button></div>');
  main.querySelectorAll('[data-mod]').forEach(b=>b.addEventListener('click',()=>{ const k=+b.dataset.mod; if(k===S.mod) return; S.mod=k; store.set(KEY,S); mountEx(); renderSheet() }));
  const st=$('#startEx'); if(st) st.addEventListener('click',()=>EX.start());
  if(!open) return;
  const base='module'+mod+'_'+codeOf(C).replace('.','_')+(who?'_'+who.replace(/\s+/g,'_'):'');
  $('#cpTask').addEventListener('click',()=>copyRich($('#sheet').innerHTML,modelText(M),$('#sheet')));
  const dx=$('#dxTask'); if(dx) dx.addEventListener('click',async()=>{ try{ toast('Собираю документ…'); await saveFile(base+'.docx',await buildDocx([M])) }catch(e){ toast('Не удалось собрать документ') } });
  const pr=$('#prTask'); if(pr) pr.addEventListener('click',()=>printSheets([modelHtml(M)]));
}
mountEx();
onSaveReady(()=>{ if(DL) render() });
render();

})();
</script>
</body>
</html>
