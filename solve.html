<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Всё об линуксе и точка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
/* Layout: header (title · theme · settings) → one compact toolbar (code · level · traps · random) → three sections; the task itself is a paper sheet */
:root{
  --bg:#eef2f3; --surface:#ffffff; --raise:#f5f8f8; --sunk:#e7eced; --ink:#0f1b1f; --muted:#56686e; --faint:#8a9a9f; --line:#dbe3e5; --line-strong:#c4d0d3;
  --accent:#0a7a70; --accent-soft:#ddf1ee; --accent-ink:#ffffff;
  --paper:#fffefc; --paper-ink:#1b1d1f; --paper-line:#cfd5d6;
  --easy:#2c8a4b; --exam:#2b5fc4; --hard:#c2471f;
  --router:#0a7a70; --server:#b0640f; --client:#6d4fc9;
  --term:#0c1517; --term-ink:#d6e4e6; --term-dim:#6e8489; --term-line:#1c2a2e; --term-str:#e8c07d;
  --warn:#8a5500; --warn-bg:#fff2d9; --err:#b42318; --err-bg:#fdecea; --ok:#0f7f55; --ok-bg:#e3f5ec;
  --shadow:0 1px 2px rgba(15,27,31,.05),0 6px 18px rgba(15,27,31,.06);
  --pop:0 10px 30px rgba(15,27,31,.16);
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --sans:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --doc:"PT Serif","Times New Roman",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1113; --surface:#111b1e; --raise:#162226; --sunk:#0d1618; --ink:#e2ecee; --muted:#93a6ab; --faint:#64777c; --line:#223236; --line-strong:#2f4449;
  --accent:#3fc6b5; --accent-soft:#11302c; --accent-ink:#03201b;
  --paper:#131d20; --paper-ink:#e2e8e9; --paper-line:#2b3a3e;
  --easy:#5fca83; --exam:#81a7ff; --hard:#ff8d63;
  --router:#3fc6b5; --server:#f0a65a; --client:#b49cff;
  --term:#060b0c; --term-ink:#d6e4e6; --term-dim:#6e8489; --term-line:#182427; --term-str:#e8c07d;
  --warn:#f3b65c; --warn-bg:#2a2111; --err:#ff8b80; --err-bg:#2e1614; --ok:#4fd39a; --ok-bg:#11291f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --pop:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1113; --surface:#111b1e; --raise:#162226; --sunk:#0d1618; --ink:#e2ecee; --muted:#93a6ab; --faint:#64777c; --line:#223236; --line-strong:#2f4449;
  --accent:#3fc6b5; --accent-soft:#11302c; --accent-ink:#03201b;
  --paper:#131d20; --paper-ink:#e2e8e9; --paper-line:#2b3a3e;
  --easy:#5fca83; --exam:#81a7ff; --hard:#ff8d63;
  --router:#3fc6b5; --server:#f0a65a; --client:#b49cff;
  --term:#060b0c; --term-ink:#d6e4e6; --term-dim:#6e8489; --term-line:#182427; --term-str:#e8c07d;
  --warn:#f3b65c; --warn-bg:#2a2111; --err:#ff8b80; --err-bg:#2e1614; --ok:#4fd39a; --ok-bg:#11291f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --pop:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;transition:background-color .2s}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code,.mono{font-family:var(--mono)}
svg.i{width:16px;height:16px;flex:none}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,2.6vw,1.6rem);letter-spacing:-.01em;margin:0;text-wrap:balance}
.topacts{display:flex;gap:8px;align-items:center}
.lead{color:var(--muted);margin:0;max-width:70ch}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 13px;font-weight:600;font-size:.86rem;white-space:nowrap;display:inline-flex;gap:7px;align-items:center;justify-content:center;transition:border-color .15s,color .15s,background-color .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--accent);background:var(--raise)}
.btn.icon{padding:8px;width:38px;height:38px}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:.82rem}
.lnk:hover{text-decoration:underline}

/* segmented */
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:8px;font-size:.84rem;font-weight:600;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.seg button .n{font-family:var(--mono);font-size:.7rem;color:var(--faint)}
.seg.theme button{padding:6px 8px}

/* level colors */
.lv-E{--lv:var(--easy)} .lv-X{--lv:var(--exam)} .lv-H{--lv:var(--hard)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--lv,var(--muted))}

/* toolbar */
.toolbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .grow{flex:1 1 0;min-width:0}
.codef{display:flex;align-items:stretch;border:1.5px solid var(--lv);border-radius:12px;overflow:hidden;background:var(--surface)}
.codef button{border:0;background:var(--raise);color:var(--muted);width:34px;font-size:1.15rem;line-height:1}
.codef button:hover{color:var(--ink);background:var(--sunk)}
.codef input{width:7.6em;border:0;border-inline:1px solid var(--line);background:var(--surface);text-align:center;font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.01em;padding:7px 4px;color:var(--lv);text-transform:uppercase}
.codef input:focus{outline:none;background:var(--raise)}
.lvseg button[aria-pressed="true"]{color:var(--lv)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--raise);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
button.pill:hover{filter:brightness(.97)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}

/* dropdown */
.dd{position:relative}
.ddp{position:absolute;z-index:15;top:calc(100% + 6px);left:0;min-width:290px;max-width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:8px;display:flex;flex-direction:column;gap:2px}
.ddi{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;font-size:.86rem;font-weight:500;cursor:pointer}
.ddi:hover{background:var(--raise)}
.ddi input{width:16px;height:16px;accent-color:var(--hard);margin:0}
.ddf{display:flex;gap:14px;padding:8px 8px 4px;border-top:1px solid var(--line);margin-top:4px}

/* section nav */
.nav{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.nav button{background:none;border:0;padding:10px 14px 11px;font-weight:600;font-size:.94rem;color:var(--muted);white-space:nowrap;border-bottom:2.5px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.nav .cnt{font-family:var(--mono);font-size:.7rem;background:var(--raise);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:0 6px}

.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:space-between}
.bar .l,.bar .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint,.bar p{margin:0;color:var(--muted);font-size:.84rem;max-width:72ch}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{font-size:.85rem;padding:8px 12px;border-radius:10px}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.msg.err{background:var(--err-bg);color:var(--err)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0;font-size:1rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 small{font-weight:600;font-size:.76rem;color:var(--muted)}
.card .sub{margin:-6px 0 0;color:var(--muted);font-size:.82rem}
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:1rem}

/* paper sheet */
.sheet{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;box-shadow:var(--shadow);padding:clamp(20px,4.5vw,56px);font-family:var(--doc);font-size:1.02rem;line-height:1.55;max-width:900px;width:100%;margin:0 auto;min-width:0}
.sheet .dochead{display:flex;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;font-family:var(--sans);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--paper-line);padding-bottom:10px;margin-bottom:22px}
.sheet .dochead b{color:var(--paper-ink)}
.sheet h2{font-family:var(--doc);font-size:1.45rem;margin:0 0 6px;text-wrap:balance}
.sheet h3{font-family:var(--doc);font-size:1.08rem;margin:22px 0 8px}
.sheet p{margin:0 0 10px}
.sheet ol.items{padding-left:1.6em;margin:8px 0 0;display:flex;flex-direction:column;gap:14px}
.sheet ol.items>li{padding-left:4px}
.sheet ol.items>li::marker{font-weight:700}
.sheet ul{margin:6px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.sheet b.v{font-family:var(--mono);font-size:.88em;font-weight:600;white-space:nowrap}
.sheet .tblw{overflow-x:auto;margin:8px 0 4px}
.sheet table{border-collapse:collapse;font-size:.92rem;min-width:420px;width:100%}
.sheet th,.sheet td{border:1px solid var(--paper-line);padding:5px 9px;text-align:left;vertical-align:top}
.sheet th{font-weight:700;background:color-mix(in srgb,var(--paper-line) 30%,transparent)}
.sheet .cap{font-size:.86rem;font-style:italic;margin:16px 0 0}
.sheet .note{font-size:.86rem;color:var(--muted);border-top:1px solid var(--paper-line);padding-top:10px;margin-top:22px}
.topo{width:100%;max-width:100%;height:auto;display:block;margin:6px 0 0}
.topo .ln{stroke:var(--muted);stroke-width:1.6;fill:none}
.topo .tn{stroke:var(--accent);stroke-width:2;stroke-dasharray:7 5;fill:none}
.topo .nd{fill:var(--paper);stroke-width:1.6}
.topo .r{stroke:var(--router)} .topo .s{stroke:var(--server)} .topo .c{stroke:var(--client)} .topo .w{stroke:var(--muted)}
.topo text{font-family:var(--sans);fill:var(--paper-ink)}
.topo .nm{font-size:14px;font-weight:700}
.topo .lb{font-size:11.5px;fill:var(--muted);font-family:var(--mono)}
.topo .tl{font-size:12px;fill:var(--accent);font-weight:700}
.topo .cloud{fill:var(--raise);stroke:var(--line);stroke-width:1.4}

/* key */
.who{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:12px;padding:9px 12px 9px 14px;font-size:.9rem}
.keygrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:14px;align-items:start}
@media (max-width:980px){.keygrid{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.score{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1}
.score .big small{font-family:var(--sans);font-size:.85rem;color:var(--muted);font-weight:600}
.meter{flex:1;min-width:140px;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.checks{display:flex;flex-direction:column}
.ck{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.ck:first-child{border-top:0;padding-top:2px}
.ck input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.ck .h{font-weight:700;font-size:.92rem;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.ck .h .num{color:var(--faint);font-family:var(--mono);font-size:.78rem;min-width:1.4em}
.ck .pts{font-family:var(--mono);font-size:.76rem;color:var(--muted);white-space:nowrap;padding-top:2px}
.ck input:checked ~ .h{color:var(--ok)}
.ck .rows{grid-column:2/-1;display:flex;flex-direction:column;gap:5px}
.cr{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:3px 12px;font-size:.8rem;align-items:center}
@media (max-width:640px){.cr{grid-template-columns:minmax(0,1fr)}}
.cr code{font-size:.74rem;background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:3px 8px;word-break:break-word;user-select:all}
.cr .exp{color:var(--muted)}
.cr .exp b{color:var(--ok);font-family:var(--mono);font-weight:600;font-size:.74rem}
.ans{display:flex;flex-direction:column}
.ar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:9px 0;border-top:1px solid var(--line)}
.ar:first-child{border-top:0;padding-top:0}
.ar .an{font-size:.8rem;font-weight:700}
.ar .an i{font-style:normal;color:var(--muted);font-weight:600}
.ar b{font-family:var(--mono);font-size:.86rem;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.ar small{grid-column:1/-1;font-family:var(--mono);font-size:.72rem;color:var(--muted);line-height:1.5}
.ar small em{font-style:normal;color:var(--accent)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.tlist li{display:flex;gap:9px;font-size:.82rem;line-height:1.4}
.tlist li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--hard);margin-top:.5em}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.fold>summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:700;font-size:.95rem;display:flex;justify-content:space-between;gap:10px;align-items:center;border-radius:var(--r)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:hover{background:var(--raise)}
details.fold>summary small{font-weight:500;color:var(--muted);font-size:.8rem;margin-left:auto}
details.fold>summary .chev{transition:transform .15s;color:var(--muted)}
details.fold[open]>summary .chev{transform:rotate(180deg)}
details.fold>.fb{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.tbl{overflow-x:auto}
table.dt{border-collapse:collapse;width:100%;font-size:.85rem}
.dt th,.dt td{text-align:left;padding:7px 12px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.dt th{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.dt td{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.8rem}
.dt td:first-child{font-family:var(--sans);font-weight:700;font-size:.85rem}
.dt tr:last-child td{border-bottom:0}
.dt .act{display:flex;gap:6px;justify-content:flex-end}
.rowbtn{font-size:.78rem;font-weight:600;background:none;border:1px solid var(--line);border-radius:8px;padding:3px 10px;color:var(--accent);font-family:var(--sans)}
.rowbtn:hover{border-color:var(--accent)}
.rowbtn.del{color:var(--muted)}
.rowbtn.del:hover{color:var(--err);border-color:var(--err)}
.lvtag{display:inline-flex;gap:6px;align-items:center;font-family:var(--sans);font-weight:700}

/* solve */
.mlist{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:1100px){.mlist{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.mlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mc{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mc:hover{border-color:var(--line-strong)}
.mc[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.mc .top2{display:flex;align-items:center;gap:8px;min-width:0}
.mc .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none}
.mc .ic svg{width:14px;height:14px}
.mc.router .ic{background:color-mix(in srgb,var(--router) 14%,transparent);color:var(--router)}
.mc.server .ic{background:color-mix(in srgb,var(--server) 14%,transparent);color:var(--server)}
.mc.client .ic{background:color-mix(in srgb,var(--client) 14%,transparent);color:var(--client)}
.mc .nm{font-weight:700;font-size:.92rem}
.mc .ip{font-family:var(--mono);font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .steps{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.64rem;font-weight:600;background:var(--raise);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:0 7px}
.mc[aria-pressed="true"] .chip{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.viewer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.vh{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px 16px}
.vh h2{margin:0;font-size:1.12rem}
.vh p{margin:2px 0 0;color:var(--muted);font-size:.84rem}
.send{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:.82rem;color:var(--muted)}
.send code{font-size:.76rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px 8px;word-break:break-all;user-select:all}
.send details{width:100%}
.send summary{cursor:pointer;color:var(--accent);font-weight:600;width:max-content}
.send ol{margin:8px 0 2px;padding-left:1.3em;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.order{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:4px;font-size:.84rem}
.order li::marker{font-family:var(--mono);color:var(--faint)}
.order b{font-weight:700}
.order span{color:var(--muted)}
.term{background:var(--term);border:1px solid var(--term-line);border-radius:12px;overflow:hidden;min-width:0}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 8px 7px 14px;border-bottom:1px solid var(--term-line)}
.tbar .fn{font-family:var(--mono);font-size:.74rem;color:var(--term-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .acts{display:flex;gap:6px}
.tb{font-size:.78rem;font-weight:600;border-radius:8px;padding:5px 12px;white-space:nowrap;border:1px solid var(--term-line);background:transparent;color:var(--term-ink)}
.tb:hover{border-color:var(--term-dim)}
.tb.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
pre{margin:0;padding:14px 16px;overflow:auto;max-height:60vh;font-family:var(--mono);font-size:.78rem;line-height:1.6;color:var(--term-ink);tab-size:2}
pre.wrap{white-space:pre-wrap}
pre .cm{color:var(--term-dim)} pre .hd{color:var(--term-str)}
.manual{display:flex;flex-direction:column;gap:10px}
.mi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.mi>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;gap:12px;align-items:baseline;border-radius:var(--r)}
.mi>summary::-webkit-details-marker{display:none}
.mi>summary:hover{background:var(--raise)}
.mi>summary .num{font-family:var(--mono);font-size:.8rem;color:var(--accent);min-width:1.4em}
.mi>summary b{font-size:.96rem}
.mi>summary .chev{margin-left:auto;color:var(--muted);transition:transform .15s;align-self:center}
.mi[open]>summary .chev{transform:rotate(180deg)}
.mi .fb{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.mi .fb>p{margin:0;color:var(--muted);font-size:.87rem;max-width:80ch}
.blk{display:flex;flex-direction:column;gap:6px;min-width:0}
.blk .mh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;font-weight:700}
.blk pre{background:var(--term);border:1px solid var(--term-line);border-radius:10px;max-height:none;font-size:.75rem}
.mi .chk{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mi .chk code{font-size:.72rem;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:1px 6px}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,370px),1fr));gap:14px;align-items:start}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.row{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
label{font-size:.78rem;font-weight:600}
input,select,textarea{font-size:.86rem;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
input:hover,select:hover,textarea:hover{border-color:var(--line-strong)}
input.mono{font-family:var(--mono);font-size:.82rem}
textarea{min-height:130px;resize:vertical;line-height:1.5}
.lan{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.lan .lt{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.lan .lt b{font-size:.88rem}
.lan .sentence{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.84rem}
.lan .sentence input,.lan .sentence select{width:auto;background:var(--surface);padding:6px 8px}
.w-ip{width:9.5em!important}.w-n{width:5em!important}.w-v{width:5.4em!important}
.calc{font-family:var(--mono);font-size:.74rem;color:var(--ok)}
.inline{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.inline .f{width:auto}
.inline input,.inline select{width:auto}
.linkbox{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap;font-size:.84rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.linkbox code{font-size:.78rem;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:3px 8px;user-select:all;word-break:break-all}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:.84rem;color:var(--err);font-weight:600;flex-wrap:wrap}

/* student page */
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.entry .ef{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry .bigin{font-family:var(--display);font-weight:700;font-size:1.15rem;text-transform:uppercase;width:8.5em;text-align:center;letter-spacing:.02em;background:var(--surface);border:1.5px solid var(--line-strong)}
.entry .bigin:focus{border-color:var(--accent);outline:none}
.entry .cur{display:flex;flex-direction:column;gap:1px}
.entry .cur small{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.entry .cur b{font-family:var(--display);font-size:1.25rem;color:var(--lv)}
.train{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:12px;border-top:1px solid var(--line);width:100%}

.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.85rem;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:30;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:none}
#printArea{display:none}
@media (max-width:560px){
  .toolbar .grow{display:none}
  .btn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff;padding:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea .sheet{box-shadow:none;border:0;max-width:none;padding:0;background:#fff;color:#000;page-break-after:always}
  #printArea .sheet:last-child{page-break-after:auto}
}
@media print{
  #printArea{--paper:#fff;--paper-ink:#000;--paper-line:#999;--muted:#555;--accent:#0a7a70;--raise:#f4f4f4;--line:#ccc;--router:#0a7a70;--server:#b0640f;--client:#6d4fc9}
}
.dt td.nm{font-family:var(--sans);font-size:.88rem;font-weight:600}

/* ===== brand: ДЭ·Лаб — RJ45 mark, T568B cable band, LED level lights ===== */
:root{--c1:#f3a35c;--c2:#e2690f;--c3:#8fd19b;--c4:#2f6fdc;--c5:#9dbcf2;--c6:#2b9a4e;--c7:#cfa47c;--c8:#7a4a26;--glow:color-mix(in srgb,var(--lv,var(--accent)) 45%,transparent)}
.brandbar{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;flex:none;filter:drop-shadow(0 4px 10px color-mix(in srgb,var(--accent) 30%,transparent))}
.logo .lg-bg{fill:var(--accent)}
.logo .lg-port{fill:var(--sunk)}
.brand .wordmark{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1;letter-spacing:-.01em}
.brand .wordmark span{color:var(--accent);margin:0 .06em}
.brand h1{font-family:var(--sans);font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:0;margin:3px 0 0}
.cable{height:5px;border-radius:99px;background:linear-gradient(90deg,var(--c1) 0 12.5%,var(--c2) 0 25%,var(--c3) 0 37.5%,var(--c4) 0 50%,var(--c5) 0 62.5%,var(--c6) 0 75%,var(--c7) 0 87.5%,var(--c8) 0);opacity:.9;margin-top:-4px}
:root{--easy:#2b9a4e;--exam:#2f6fdc;--hard:#e2690f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--easy:#62d07f;--exam:#7fa6ff;--hard:#ff9550}}
:root[data-theme="dark"]{--easy:#62d07f;--exam:#7fa6ff;--hard:#ff9550}
.dot{box-shadow:0 0 0 3px color-mix(in srgb,var(--lv,var(--muted)) 18%,transparent)}
[aria-pressed="true"]>.dot{box-shadow:0 0 0 3px color-mix(in srgb,var(--lv) 25%,transparent),0 0 10px var(--glow)}

/* toolbar as a patch-panel plate */
.toolbar{padding:12px;gap:12px;background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 92%,var(--sunk)))}
.plate{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 12px;border-radius:14px;background:var(--sunk);border:1px solid var(--line)}
.plate .pl{display:flex;flex-direction:column;line-height:1.1}
.plate .pl small{font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.plate .pl b{font-size:.74rem;font-weight:700;color:var(--lv);display:flex;gap:6px;align-items:center;white-space:nowrap}
.led{width:9px;height:9px;border-radius:50%;background:var(--lv);box-shadow:0 0 0 3px color-mix(in srgb,var(--lv) 22%,transparent),0 0 12px var(--glow);flex:none}
@media (prefers-reduced-motion:no-preference){.led{animation:blink 2.6s ease-in-out infinite}}
@keyframes blink{0%,86%,100%{opacity:1}90%{opacity:.35}}
.codef{border-width:1.5px;box-shadow:0 1px 0 var(--surface) inset}
.codef input{font-size:1.15rem;width:7.2em}

/* section nav as three friendly cards */
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-bottom:0;overflow:visible}
.nav button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);margin:0;color:var(--ink);min-width:0;white-space:normal;transition:border-color .15s,background-color .15s,transform .15s}
.nav button:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.nav button[aria-current="page"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface));box-shadow:var(--shadow)}
.nav .ni{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--raise);color:var(--muted)}
.nav .ni svg{width:20px;height:20px}
.nav button[aria-current="page"] .ni{background:var(--accent);color:var(--accent-ink)}
.nav .nt{display:flex;flex-direction:column;min-width:0}
.nav .nt b{font-size:.98rem;display:flex;gap:8px;align-items:center}
.nav .nt span{font-size:.78rem;color:var(--muted);font-weight:500;line-height:1.35}
@media (max-width:700px){.nav .nt span{display:none}.nav button{padding:10px;gap:8px;justify-content:center}.nav .ni{width:30px;height:30px}}

/* first-run guide */
.guide{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface) 60%);border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.guide .gh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.guide .gh b{font-size:1.02rem}
.guide ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;counter-reset:g}
@media (max-width:760px){.guide ol{grid-template-columns:minmax(0,1fr)}}
.guide li{counter-increment:g;display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.86rem}
.guide li::before{content:counter(g);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:.78rem;display:grid;place-items:center}
.guide li b{display:block;font-size:.9rem;margin-bottom:1px}
.guide li span{color:var(--muted)}

/* student hero */
.entry{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),var(--surface) 55%);padding:18px}
.hello{display:flex;flex-direction:column;gap:3px;flex:1 1 280px;min-width:0}
.hello b{font-family:var(--display);font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.hello span{color:var(--muted);font-size:.9rem}
.badge{display:flex;align-items:center;gap:12px;padding:8px 16px 8px 12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--lv);box-shadow:0 6px 18px color-mix(in srgb,var(--lv) 16%,transparent)}
.badge .bc{display:flex;flex-direction:column;line-height:1.1}
.badge small{font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.badge b{font-family:var(--display);font-size:1.4rem;color:var(--lv)}

/* exam timer */
.timer{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 5px 4px 10px;color:var(--muted)}
.timer .tph{font-size:.74rem;font-weight:700;color:var(--accent)}
.timer[data-st~="pause"] .tph{color:var(--muted)}.timer[data-st~="done"] .tph{color:var(--err)}
.timer[data-st~="idle"] .tm{font-family:var(--sans);font-size:.84rem;font-weight:600;color:var(--muted);min-width:0}
.timer .tm{font-family:var(--mono);font-size:1.05rem;font-weight:600;color:var(--ink);min-width:4.2em;text-align:center;font-variant-numeric:tabular-nums}
.timer .tb{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:4px 10px;font-size:.78rem;font-weight:600;color:var(--ink)}
.timer .tb:hover{border-color:var(--accent);color:var(--accent)}
.timer .tb.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.timer[data-st~="run"]{border-color:var(--accent)}
.timer[data-st~="run"] svg{color:var(--accent)}
.timer[data-st~="warn"]{background:var(--warn-bg);border-color:transparent}
.timer[data-st~="warn"] .tm,.timer[data-st~="warn"] svg{color:var(--warn)}
.timer[data-st~="done"]{background:var(--err-bg);border-color:transparent}
.timer[data-st~="done"] .tm,.timer[data-st~="done"] svg{color:var(--err)}
@media (prefers-reduced-motion:no-preference){.timer[data-st~="done"] .tm{animation:blink 1.2s ease-in-out infinite}}
@media print{.timer{display:none}}

/* solve page */
.paste{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px}
.paste textarea{min-height:170px;font-size:.84rem;background:var(--raise)}
.paste .pa{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.paste .pa .hint{flex:1 1 260px}
.pr{display:flex;flex-wrap:wrap;gap:6px}
.pr .pill{cursor:pointer;font-weight:600}
.pr .pill b{font-family:var(--mono);font-weight:600}
.pr .pill.free{background:var(--raise)}
.prsum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.prsum span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--line-strong)}
.prsum .k-ok::before{background:var(--ok)}.prsum .k-warn::before{background:var(--warn)}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
a.btn{text-decoration:none;color:var(--muted)}
.topacts{flex-wrap:wrap}

/* modules + locked task */
.modseg button{font-weight:700}
.modseg button small{font-weight:600;color:var(--faint);font-size:.72rem}
.locked{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:var(--shadow)}
.locked .lk{width:52px;height:52px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.locked .lk svg{width:26px;height:26px}
.locked h2{margin:0;font-family:var(--display);font-size:1.25rem}
.locked p{margin:0;color:var(--muted);max-width:52ch}
.locked .steps3{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:.82rem}
.locked .steps3 span{background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600}
.locked .steps3 b{font-family:var(--mono);color:var(--accent)}
.sheet.reading{position:relative}
.readbanner{display:flex;gap:8px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:9px 14px;font-size:.86rem;font-weight:600}
.bar>.l{min-width:0;max-width:100%}
.bar>.l>.seg{max-width:100%}
@media (max-width:560px){.modseg button small{display:none}}
/* ===== Общая тема «документация дистрибутива»: подключается ко всем трём страницам после style.css =====
   Тёмная шапка, светлое полотно, синие ссылки, оранжевый фирменный акцент, радиус 6px, блоки кода как в справочниках. */
:root,.tk{
  --bg:#f3f5f7; --surface:#ffffff; --raise:#f6f8fa; --sunk:#eaeef2; --ink:#1c2128; --muted:#57606a; --faint:#818b98; --line:#d8dee4; --line-strong:#b9c2cc;
  --accent:#1660c4; --accent-soft:#e6f0fd; --accent-ink:#ffffff;
  --term:#f6f8fa; --term-ink:#1c2128; --term-dim:#6a737d; --term-line:#d0d7de; --term-str:#9a4f00;
  --paper:#ffffff; --paper-ink:#1c2128; --paper-line:#cfd5db;
  --warn:#7a4b00; --warn-bg:#fff4d6; --err:#b42318; --err-bg:#fdecea; --ok:#11734f; --ok-bg:#e2f5ec;
  --tip:#0b6e63; --tip-bg:#e0f4f1;
}
:root{
  --hdr:#1f2630; --hdr-2:#2b3441; --hdr-ink:#f2f5f8; --hdr-muted:#a9b4c1; --hdr-line:#3b4656; --brand:#e2690f;
  --shadow:0 1px 2px rgba(27,31,36,.06); --pop:0 8px 24px rgba(27,31,36,.18); --r:6px;
  --display:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]),:root:not([data-theme="light"]) .tk{
  --bg:#0d1117; --surface:#151b23; --raise:#1b222c; --sunk:#10151c; --ink:#e6edf3; --muted:#9aa7b4; --faint:#6e7b89; --line:#2a323d; --line-strong:#3d4856;
  --accent:#6ea8fe; --accent-soft:#182a45; --accent-ink:#08172e;
  --term:#0d1117; --term-ink:#dde5ec; --term-dim:#7d8894; --term-line:#2a323d; --term-str:#e8c07d;
  --paper:#161c24; --paper-ink:#e2e8ee; --paper-line:#2f3945;
  --warn:#f3b65c; --warn-bg:#2b2211; --err:#ff8b80; --err-bg:#2e1614; --ok:#4fd39a; --ok-bg:#11291f;
  --tip:#5ed3c4; --tip-bg:#0f2a27}
  :root:not([data-theme="light"]){--hdr:#0a0e13; --hdr-2:#161c24; --hdr-line:#2a323d; --pop:0 12px 32px rgba(0,0,0,.55)}}
:root[data-theme="dark"],:root[data-theme="dark"] .tk{
  --bg:#0d1117; --surface:#151b23; --raise:#1b222c; --sunk:#10151c; --ink:#e6edf3; --muted:#9aa7b4; --faint:#6e7b89; --line:#2a323d; --line-strong:#3d4856;
  --accent:#6ea8fe; --accent-soft:#182a45; --accent-ink:#08172e;
  --term:#0d1117; --term-ink:#dde5ec; --term-dim:#7d8894; --term-line:#2a323d; --term-str:#e8c07d;
  --paper:#161c24; --paper-ink:#e2e8ee; --paper-line:#2f3945;
  --warn:#f3b65c; --warn-bg:#2b2211; --err:#ff8b80; --err-bg:#2e1614; --ok:#4fd39a; --ok-bg:#11291f;
  --tip:#5ed3c4; --tip-bg:#0f2a27}
:root[data-theme="dark"]{--hdr:#0a0e13; --hdr-2:#161c24; --hdr-line:#2a323d; --pop:0 12px 32px rgba(0,0,0,.55)}
.tk{color:var(--ink)}

/* размер текста (настройка «Аа») */
:root[data-fs="s"]{font-size:14px} :root[data-fs="l"]{font-size:18px}
html{background:var(--bg);overflow-x:clip}
body{font-size:.94rem;line-height:1.6;min-height:100vh}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
a{color:var(--accent)}

/* ---------- шапка: тёмная полоса на всю ширину ---------- */
.top{
  --surface:var(--hdr-2); --raise:#364252; --sunk:#151a21; --ink:var(--hdr-ink); --muted:var(--hdr-muted); --faint:#8492a2; --line:var(--hdr-line); --line-strong:#536074;
  --accent:#8dbbff; --accent-soft:#2a3b55; --accent-ink:#08172e;
  --warn:#f3b65c; --warn-bg:#3a2d12; --err:#ff8b80; --err-bg:#42201c;
  background:var(--hdr); color:var(--ink)}
.wrap{gap:16px}
body:has(>.wrap){padding-top:0}
.wrap>.top{margin-inline:calc(50% - 50vw);padding:10px max(16px,calc(50vw - 50%))}
.wrap>.cable{margin:-16px calc(50% - 50vw) 4px;border-radius:0;height:3px}
.cable{opacity:1}
.logo{width:38px;height:38px;filter:none}
.logo .lg-bg{fill:var(--brand)}
.logo .lg-port{fill:#1f2630}
.brand .wordmark{font-family:var(--sans);font-weight:700;font-size:1.3rem;letter-spacing:0}
.brand .wordmark span{color:var(--brand)}
.brand h1{font-size:.76rem;font-weight:500}
.top .btn.ghost{color:var(--ink)}
.top .seg,.wk-top .seg{background:var(--sunk)}
.top .seg button[aria-pressed="true"],.wk-top .seg button[aria-pressed="true"]{background:var(--raise);box-shadow:none}
.timer{border-radius:var(--r)}

/* ---------- кнопки, поля, переключатели ---------- */
.btn,.seg,.seg button,input,select,textarea,.tb,.rowbtn,.chip,.codef,.plate,.badge,.ddp,.ddi,.toast{border-radius:var(--r)}
.seg button{border-radius:4px}
.btn{background:var(--surface);border-color:var(--line-strong);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{color:var(--accent-ink);background:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);box-shadow:none}
.btn.ghost:hover{background:var(--raise);border-color:var(--line)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
a.btn{color:var(--ink)}
input,select,textarea{background:var(--surface);border-color:var(--line-strong)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:0}
.paste textarea,.lan .sentence input,.lan .sentence select{background:var(--surface)}
.seg{background:var(--sunk)}
.pill{border-radius:999px}

/* ---------- карточки, панели, примечания ---------- */
.card,.toolbar,.paste,.viewer,.entry,.locked,.guide,.mi,details.fold,.lan,.empty,.linkbox,.send,.who,.mc,.term,.blk pre,.readbanner,.guide li{border-radius:var(--r)}
.card,.toolbar,.paste,.entry{box-shadow:var(--shadow)}
.toolbar{background:var(--surface)}
.card h3{font-size:1.02rem;padding-bottom:8px;border-bottom:1px solid var(--line)}
.msg{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:.88rem}
.msg.warn{border-left-color:#d9a400;background:var(--warn-bg);color:var(--ink)}
.msg.err{border-left-color:#d1382c;background:var(--err-bg);color:var(--ink)}
.msg.tip{border-left-color:var(--tip);background:var(--tip-bg)}
.nav button{border-width:1px;border-radius:var(--r)}
.nav .ni{border-radius:var(--r)}
.entry,.guide{background:var(--surface)}
.entry{border-left:4px solid var(--brand)}
.hello b,.locked h2,.badge b,.entry .cur b,.score .big,.codef input,.entry .bigin{font-family:var(--sans)}
.sheet{border-radius:var(--r)}
.sheet,.sheet h2,.sheet h3{font-family:var(--sans)}
.sheet h2{font-size:1.5rem;font-weight:700}
.sheet h3{font-size:1.12rem;padding-bottom:4px;border-bottom:1px solid var(--paper-line)}
.locked .lk{border-radius:var(--r)}

/* ---------- код ---------- */
code{background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.86em}
.term{background:var(--term);border:1px solid var(--term-line)}
.tbar{background:var(--sunk);border-bottom:1px solid var(--term-line)}
.tb{color:var(--ink);background:var(--surface);border-color:var(--line-strong)}
.tb:hover{border-color:var(--accent);color:var(--accent)}
.blk pre{border:1px solid var(--term-line)}
pre{font-size:.8rem}
pre .cm{font-style:italic}
:root[data-wrap="1"] pre{white-space:pre-wrap;word-break:break-word}
.toast{background:var(--hdr);color:var(--hdr-ink);border:1px solid var(--hdr-line);box-shadow:var(--pop);font-weight:600}
/* ===== ДЭ·Вики (solve.html): шапка с поиском, дерево разделов слева, статья, оглавление справа ===== */
:root{--sol:#d4580a;--sol-soft:#fdefe4;--side-w:264px;--toc-w:232px;--top-h:59px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sol:#ff8a4d;--sol-soft:#3a2216}}
:root[data-theme="dark"]{--sol:#ff8a4d;--sol-soft:#3a2216}

html{scroll-padding-top:calc(var(--top-h) + 16px)}
body{padding:0 0 0;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:var(--r);font-weight:600}
.skip:focus{top:8px}
.wk a.btn{text-decoration:none}
.wk-prog{position:fixed;inset:0 0 auto 0;height:3px;z-index:60;pointer-events:none}
.wk-prog i{display:block;height:100%;width:0;background:var(--brand)}

/* ---------- шапка ---------- */
.wk-top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px 18px;padding:9px 20px;min-height:var(--top-h)}
.brandlink{text-decoration:none;color:inherit;display:block;flex:none}
.wk-top .brand{gap:3px}
.wordmark span{cursor:default}
.tagline{font-size:.72rem;color:var(--muted);line-height:1}
.wk>.cable{margin:0;border-radius:0;height:3px;position:sticky;top:var(--top-h);z-index:49}
.hbtn{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);font-size:.86rem;padding:0}
.hbtn:hover,.hbtn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
#wkMenu{display:none}
.wk-top .topacts{flex-wrap:nowrap;margin-left:auto}

.wk-search{flex:1 1 320px;max-width:560px;position:relative;display:flex;align-items:center;margin-inline:auto}
.wk-search input{padding:8px 40px 8px 36px;font-size:.9rem;background:var(--surface);border-color:var(--line)}
.wk-search input::placeholder{color:var(--faint)}
.wk-search .si{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.wk-search .sk{position:absolute;right:9px;pointer-events:none}
.wk-search input:focus~.sk{display:none}
kbd{font-family:var(--mono);font-size:.72rem;line-height:1;padding:3px 6px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;background:var(--raise);color:var(--muted);white-space:nowrap}
.wk-sug{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);z-index:40;max-height:min(70vh,520px);overflow:auto;box-shadow:var(--pop)}
.wk-sug .sg{display:flex;flex-direction:column;gap:1px;padding:8px 14px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.88rem}
.wk-sug .sg:last-child{border-bottom:0}
.wk-sug a.sg:hover,.wk-sug a.sg.act{background:var(--accent-soft)}
.wk-sug .sg b{color:var(--accent)}
.wk-sug .sg small{color:var(--faint);font-weight:400}
.wk-sug .sg span{color:var(--muted);font-size:.8rem}
.wk-sug .sg.none{color:var(--muted)}
.wk-sug .sgf{display:flex;gap:14px;padding:6px 14px;font-size:.74rem;color:var(--faint);background:var(--raise);position:sticky;bottom:0}
mark{background:color-mix(in srgb,#ffd54a 55%,transparent);color:inherit;border-radius:2px;padding:0 1px}

/* всплывающая панель настроек чтения */
.popw{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:55;width:290px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);box-shadow:var(--pop);padding:12px;display:flex;flex-direction:column;gap:10px;font-size:.86rem}
.pop .pr2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pop .pr2>span{color:var(--muted);font-weight:600;font-size:.8rem}
.pop .seg button{padding:5px 11px}
.pop .sw{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;font-size:.86rem}
.pop .sw input{width:16px;height:16px;accent-color:var(--accent)}

/* ---------- сетка ---------- */
.wk-grid{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) var(--toc-w);align-items:start;max-width:1500px;margin:0 auto}
:root[data-wide="1"] .wk-grid{max-width:none}
.wk-side,.wk-toc{position:sticky;top:calc(var(--top-h) + 3px);max-height:calc(100vh - var(--top-h) - 3px);overflow:auto;scrollbar-width:thin;padding:18px 14px 28px;display:flex;flex-direction:column;gap:20px}
.wk-side{border-right:1px solid var(--line);background:var(--surface);min-height:calc(100vh - var(--top-h) - 3px)}
.wk-toc{padding-left:6px}
.portlet h3{margin:0 0 6px;font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:0 8px}
.portlet ul,.portlet ol{list-style:none;margin:0;padding:0}
.portlet li a{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:.87rem;line-height:1.35;text-decoration:none;color:var(--ink);border-radius:var(--r);min-width:0}
.portlet li a:hover{background:var(--raise);color:var(--accent)}
.portlet li.on>a,.portlet li.on>.gh{background:var(--accent-soft);color:var(--accent);font-weight:700}
.portlet li.on>.gh a{color:var(--accent)}
.portlet li a .i{width:15px;height:15px;color:var(--muted);flex:none}
.portlet li a small{margin-left:auto;font-family:var(--mono);font-size:.7rem;color:var(--faint);font-weight:400}
.portlet.note p{margin:0;padding:0 8px;font-size:.76rem;color:var(--faint)}
/* дерево модулей */
.tree .gh{display:flex;align-items:center;border-radius:var(--r)}
.tree .gh a{flex:1;font-weight:600}
.tree .gh:hover{background:var(--raise)}
.tree .gh a:hover{background:none}
.tree .tw{flex:none;width:26px;height:28px;border:0;background:none;color:var(--muted);display:grid;place-items:center;padding:0;border-radius:var(--r)}
.tree .tw:hover{color:var(--accent);background:var(--sunk)}
.tree .tw .i{transition:transform .15s;width:14px;height:14px}
.tree .grp.open>.gh .tw .i{transform:rotate(90deg)}
.tree .grp>ul{display:none;margin:2px 0 6px 13px;padding-left:8px;border-left:1px solid var(--line)}
.tree .grp.open>ul{display:block}
.tree .grp>ul a{font-size:.83rem;padding:4px 8px;color:var(--muted)}
.tree .grp>ul li.on>a{color:var(--accent)}
.tree .tn{font-family:var(--mono);font-size:.7rem;color:var(--faint);min-width:1.5em;flex:none}
.tree .dn{margin-left:auto;color:var(--ok);font-size:.78rem;flex:none}
.portlet li.sol-li a,.portlet li.sol-li a .i{color:var(--sol);font-weight:700}
.portlet .fav-x{margin-left:auto;border:0;background:none;color:var(--faint);padding:0 4px;font-size:1rem;line-height:1}
.portlet .fav-x:hover{color:var(--err)}
/* оглавление справа */
.toc{border-left:1px solid var(--line)}
.toc li a{align-items:flex-start;gap:6px;padding:4px 8px 4px 10px;margin-left:-1px;border-left:2px solid transparent;border-radius:0 var(--r) var(--r) 0;font-size:.82rem;color:var(--muted)}
.toc li a .tn{color:var(--faint);font-family:var(--mono);font-size:.7rem;min-width:1.7em;padding-top:2px}
.toc ol{margin:0 0 2px 12px}
.toc ol a{font-size:.78rem}
.toc li.cur>a{color:var(--accent);font-weight:700;border-left-color:var(--accent);background:none}

/* ---------- статья ---------- */
.wk-art{min-width:0;padding:16px 24px 40px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:.8rem;color:var(--muted);margin:0 0 12px;min-height:1.4em}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs .sep{color:var(--faint)}
.crumbs .here{color:var(--ink);font-weight:600}
.wk-tabs{display:flex;position:relative;z-index:1;margin-bottom:-1px;overflow-x:auto;scrollbar-width:none;gap:2px;padding-left:10px}
.wk-tabs .tab{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-bottom:0;color:var(--muted);padding:8px 16px;border-radius:var(--r) var(--r) 0 0;font-weight:600;font-size:.86rem;text-decoration:none;white-space:nowrap}
.wk-tabs a.tab:hover{background:var(--sunk);color:var(--accent)}
.wk-tabs .tab.on{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:inset 0 3px 0 var(--accent)}
.wk-tabs .tab.sol{color:var(--sol);font-weight:700}
.wk-tabs .tab.sol.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--sol)}
.btn .i,.tab .i{width:16px;height:16px}
.wk-page{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 34px 30px;display:flex;flex-direction:column;gap:16px;min-width:0}
.wk-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.wk-page h1{font-family:var(--sans);font-weight:700;font-size:clamp(1.5rem,3vw,2rem);line-height:1.2;letter-spacing:-.01em;margin:0;text-wrap:balance;flex:1 1 300px;min-width:0}
.wk-acts{display:flex;gap:6px;flex:none}
.wk-acts .abtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:var(--r);padding:6px 10px;font-size:.8rem;font-weight:600}
.wk-acts .abtn:hover{border-color:var(--accent);color:var(--accent)}
.wk-acts .abtn .i{width:15px;height:15px}
.wk-acts .abtn[aria-pressed="true"]{color:#b97a00;border-color:#e0b23c;background:var(--warn-bg)}
.wk-acts .abtn[aria-pressed="true"] .i{fill:currentColor}
.wk-sub{font-size:.78rem;color:var(--faint);margin-top:-8px;display:flex;flex-wrap:wrap;gap:4px 14px}
.hatnote{margin:0;padding:8px 14px;border-left:4px solid var(--line-strong);background:var(--raise);border-radius:var(--r);font-size:.86rem;color:var(--muted)}
.wk-lead{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px 28px;align-items:start}
.wk-lead p{margin:0 0 .7em;max-width:74ch;font-size:1rem}
.wk-lead p:last-child{margin-bottom:0}

/* инфобокс */
.infobox{border:1px solid var(--line);background:var(--raise);font-size:.82rem;min-width:0;border-radius:var(--r);overflow:hidden}
.infobox .ib-t{background:var(--hdr);color:var(--hdr-ink);font-weight:700;padding:8px 12px;font-size:.88rem;border-bottom:3px solid var(--brand)}
.infobox table{width:100%;border-collapse:collapse}
.infobox th,.infobox td{padding:5px 12px;vertical-align:top;text-align:left;border-bottom:1px solid var(--line)}
.infobox tr:last-child th,.infobox tr:last-child td{border-bottom:0}
.infobox th{width:42%;font-weight:600;color:var(--muted)}
.infobox td{font-family:var(--mono);font-size:.78rem;word-break:break-word}
.infobox .ib-s th{background:var(--sunk);color:var(--ink);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}

/* заголовки разделов */
.wk-h2{margin:14px 0 0;font-family:var(--sans);font-weight:700;font-size:1.3rem;line-height:1.3;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;scroll-margin-top:calc(var(--top-h) + 16px)}
.wk-h2 .num{font-family:var(--mono);font-size:.82rem;font-weight:600;color:var(--brand)}
.wk-h2 .anc{margin-left:auto;border:0;background:none;color:var(--faint);font-family:var(--mono);font-size:.9rem;padding:0 6px;opacity:0;transition:opacity .12s;align-self:center}
.wk-h2:hover .anc,.wk-h2 .anc:focus-visible{opacity:1}
.wk-h2 .anc:hover{color:var(--accent)}
.wk-h3{font-family:var(--sans);font-weight:700;font-size:1.05rem;margin:10px 0 0;line-height:1.35}
#main{gap:16px}
#main>.mi{background:none;border:0;border-radius:0}
#main>.mi>summary{padding:8px 0 6px;border-bottom:1px solid var(--line);border-radius:0;gap:10px;align-items:baseline}
#main>.mi>summary:hover{background:none}
#main>.mi>summary b{font-weight:700;font-size:1rem;line-height:1.35}
#main>.mi>summary .num{font-family:var(--mono);font-size:.8rem;color:var(--faint)}
#main>.mi[open]>summary{border-bottom-color:var(--line-strong)}
#main>.mi>.fb{padding:14px 0 4px}
#solveBody .manual{gap:4px}
#solveBody .mi{background:none;border:0;border-radius:0}
#solveBody .mi>summary{padding:8px 6px;border-bottom:1px solid var(--line);border-radius:0}
#solveBody .mi>summary:hover{background:var(--raise)}
#solveBody .mi>summary b{font-size:1rem;font-weight:700}
#solveBody .mi>summary .num{color:var(--faint);min-width:2em}
#solveBody .mi[open]>summary{border-bottom-color:var(--line-strong)}
#solveBody .mi>.fb{padding:12px 6px 18px}
#tbSlot .toolbar{margin-bottom:10px;box-shadow:none;background:var(--raise)}
.card{background:var(--raise);box-shadow:none}
.viewer{background:none;border:0;padding:0}
.vh h2{font-size:1.15rem}
.btn.primary{background:var(--sol);border-color:var(--sol);color:#fff}
.btn.primary:hover{background:var(--sol);filter:brightness(1.08);color:#fff;border-color:var(--sol)}
:root[data-theme="dark"] .btn.primary{color:#1a0d05}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#1a0d05}}

sup.ref{font-size:.72em;line-height:0}
sup.ref a{text-decoration:none}
.notes{margin:0;padding-left:1.6em;font-size:.86rem;color:var(--muted)}
.notes li{padding:2px 0}
.mono{font-family:var(--mono)}
.catlist,.talk{margin:6px 0;padding-left:1.4em}
.talk li{margin:6px 0}
.chklist{margin:4px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.chklist li{display:flex}
.chklist code{flex:1;display:flex;align-items:center;gap:10px;padding:7px 12px;font-size:.8rem;cursor:pointer;word-break:break-word;background:var(--term);border-color:var(--term-line)}
.chklist code::before{content:"$";color:var(--brand);font-weight:700;flex:none}
.chklist code::after{content:"копировать";margin-left:auto;font-family:var(--sans);font-size:.7rem;color:var(--faint);opacity:0;flex:none}
.chklist code:hover{border-color:var(--accent)}
.chklist code:hover::after{opacity:1}

.wikitable{width:100%;border-collapse:collapse;font-size:.87rem;background:var(--surface)}
.wikitable th,.wikitable td{border:1px solid var(--line);padding:7px 12px;text-align:left;vertical-align:top}
.wikitable th{background:var(--sunk);font-weight:700;font-size:.8rem}
.wikitable td.mono{font-size:.8rem}
.wikitable tbody tr:hover td{background:var(--raise)}
.wikitable .btn{padding:4px 10px;font-size:.8rem}
.tblx{overflow-x:auto;border-radius:var(--r)}
.mtag{display:inline-block;font-family:var(--mono);font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);margin:1px 2px 1px 0;white-space:nowrap}

.catlinks{border:1px solid var(--line);background:var(--raise);border-radius:var(--r);padding:8px 12px;font-size:.82rem;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.catlinks a{text-decoration:none;padding:1px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.catlinks a:hover{border-color:var(--accent)}
.catlinks span{display:none}
.navbox{width:100%;border-collapse:collapse;border:1px solid var(--line);font-size:.82rem;background:var(--raise)}
.navbox th,.navbox td{padding:6px 12px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
.navbox th{width:1%;white-space:nowrap;background:var(--sunk)}
.navbox .nb-t{width:auto;text-align:center;background:var(--hdr);color:var(--hdr-ink);font-size:.86rem;border-top:0}
.navbox .nb-sol{font-size:.72rem;font-weight:400}
.wk-foot{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.wk-foot p{margin:0;font-size:.78rem;color:var(--faint)}
.wk a.new{color:#c92a2a}.wk a.new:visited{color:#a55858}
:root[data-theme="dark"] .wk a.new{color:#ff8b80}

/* переход к соседним статьям */
.pager{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pager a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;background:var(--surface);min-width:0}
.pager a:hover{border-color:var(--accent);background:var(--accent-soft)}
.pager a small{color:var(--faint);font-size:.74rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pager a b{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager a.nx{text-align:right;grid-column:2}

/* ---------- заглавная ---------- */
.hero{background:var(--hdr);color:var(--hdr-ink);border-radius:var(--r);padding:26px 28px;display:flex;flex-direction:column;gap:10px;border-bottom:4px solid var(--brand)}
.hero h2{margin:0;font-size:clamp(1.35rem,2.6vw,1.8rem);font-weight:700;line-height:1.2}
.hero p{margin:0;max-width:70ch;color:var(--hdr-muted);font-size:.95rem}
.hero p b{color:var(--hdr-ink)}
.hero .hx{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.hero .hx .btn{box-shadow:none}
.hero .hx .btn:not(.primary){background:transparent;border-color:var(--hdr-line);color:var(--hdr-ink)}
.hero .hx .btn:not(.primary):hover{border-color:var(--hdr-ink)}
.start{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;counter-reset:s}
.start li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise);font-size:.86rem}
.start li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:.8rem;display:grid;place-items:center}
.start li b{display:block;font-size:.92rem;margin-bottom:2px}
.start li span{color:var(--muted)}
.portal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.pbox{border:1px solid var(--line);background:var(--surface);min-width:0;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pbox h3{margin:0;padding:9px 14px;background:var(--raise);border-bottom:1px solid var(--line);font-size:.92rem;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pbox h3 a{text-decoration:none}
.pbox h3 small{font-weight:500;color:var(--faint);font-size:.76rem;margin-left:auto}
.pbox.mod{border-top:3px solid var(--brand)}
.pbox .pb{padding:12px 16px;flex:1;display:flex;flex-direction:column;gap:8px}
.pbox ol,.pbox ul{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.pbox ul.plain{list-style:none;padding:0}
.pbox ul.plain small{color:var(--faint)}
.pbox a{text-decoration:none}
.pbox a:hover{text-decoration:underline}
.pbox p{margin:0;font-size:.88rem}
.pbox .more{margin-top:auto;padding-top:6px;font-weight:600}
.pbox .pg-bar{margin-top:2px}
.empty-s{color:var(--faint);font-size:.84rem}

/* ---------- решения ---------- */
.sol-cta{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding:14px 18px;background:var(--sol-soft);border:1px solid color-mix(in srgb,var(--sol) 45%,var(--line));border-left:4px solid var(--sol);border-radius:var(--r)}
.sol-cta .sc-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.sol-cta .sc-t b{font-size:1.02rem}
.sol-cta .sc-t span{font-size:.84rem;color:var(--muted)}
.btn.big{padding:10px 20px;font-size:.95rem;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.okb{color:var(--ok);font-weight:700}
.sol-bar{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding:12px 16px;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:calc(var(--top-h) + 11px);z-index:5}
.sol-bar .pg{flex:1 1 260px;display:flex;flex-direction:column;gap:6px}
.pg-l{font-size:.84rem}.pg-l span{color:var(--muted)}
.pg-bar{height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.pg-bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.pg-acts{display:flex;gap:8px;flex-wrap:wrap}
.steps{display:flex;flex-direction:column;gap:18px}
.step{border:1px solid var(--line);border-left:4px solid var(--sol);border-radius:var(--r);background:var(--surface);padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;scroll-margin-top:calc(var(--top-h) + 90px)}
.step.done{border-left-color:var(--ok);background:var(--ok-bg)}
.st-h{display:flex;align-items:center;gap:10px}
.st-n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sol);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.85rem}
.step.done .st-n{background:var(--ok)}
.step .wk-h3{margin:0;font-size:1.05rem;flex:1;min-width:0}
.st-ok{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap}
.st-ok input{width:16px;height:16px;accent-color:var(--ok)}
.sol-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sol-nav .btn{text-decoration:none;max-width:100%}

/* ---------- наверх, окно подсказок, затемнение ---------- */
.totop{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;width:42px;height:42px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);box-shadow:var(--pop);display:grid;place-items:center}
.totop:hover{border-color:var(--accent);color:var(--accent)}
.wk-dlg{border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:0;width:min(480px,calc(100vw - 32px));box-shadow:var(--pop)}
.wk-dlg::backdrop{background:rgba(10,14,19,.55)}
.wk-dlg .dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.wk-dlg .dh button{border:0;background:none;font-size:1.3rem;line-height:1;color:var(--muted);padding:0 4px}
.wk-dlg dl{margin:0;padding:12px 16px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 16px;align-items:center;font-size:.88rem}
.wk-dlg dt{display:flex;gap:4px}
.wk-dlg dd{margin:0;color:var(--muted)}
.wk-scrim{position:fixed;inset:0;background:rgba(10,14,19,.5);z-index:44}

/* ---------- адаптив ---------- */
@media (max-width:1240px){
  .wk-grid{grid-template-columns:var(--side-w) minmax(0,1fr)}
  .wk-toc{display:none}
}
@media (max-width:900px){
  #wkMenu{display:grid}
  .wk-top{flex-wrap:wrap;padding:8px 12px;gap:8px 10px;position:static}
  .wk>.cable{position:static}
  html{scroll-padding-top:12px}
  .wk-search{order:5;flex:1 1 100%;max-width:none}
  .wk-search .sk,.tagline,#wkHelp{display:none}
  .wk-grid{grid-template-columns:minmax(0,1fr)}
  .wk-side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);max-height:none;min-height:0;z-index:45;transform:translateX(-102%);visibility:hidden;transition:transform .2s,visibility .2s;border-right:1px solid var(--line-strong)}
  .wk-side.open{transform:none;visibility:visible;box-shadow:var(--pop)}
  .wk-art{padding:12px 12px 32px}
  .wk-lead{grid-template-columns:minmax(0,1fr)}
  .wk-page{padding:18px 16px 22px}
  .sol-bar{position:static}
  .wikitable{min-width:480px}
}
@media (max-width:560px){
  .wk-tabs .tab{padding:8px 11px}
  .wk-acts .abtn span{display:none}
  .sol-cta .btn.big{width:100%;justify-content:center}
  .st-h{flex-wrap:wrap}
  .pager{grid-template-columns:minmax(0,1fr)}
  .pager a.nx{grid-column:1}
  .hero{padding:20px 18px}
}
/* ===== RETRO: классическая вики начала 2000-х — серый фон, рамки, засечки в заголовках, никаких скруглений и теней ===== */
:root{
  --r:0px; --shadow:none; --top-h:0px;
  --bg:#f6f6f6; --surface:#ffffff; --raise:#f8f9fa; --sunk:#eaecf0; --ink:#202122; --muted:#54595d; --faint:#72777d; --line:#c8ccd1; --line-strong:#a2a9b1;
  --accent:#0645ad; --accent-soft:#eaf3ff; --accent-ink:#ffffff; --visited:#0b0080; --red:#ba0000;
  --term:#f9f9f9; --term-ink:#000000; --term-dim:#5a6268; --term-line:#2f6fab; --term-str:#8a4b00;
  --b1:#cedff2; --b1bg:#f5faff; --b1l:#a3b0bf; --b2:#cef2e0; --b2bg:#f5fffa; --b2l:#a3bfb1; --b3:#ddcef2; --b3bg:#faf5ff; --b3l:#afa3bf;
  --serif:"Linux Libertine","Georgia","Times New Roman",serif;
  --sans:Arial,"Helvetica Neue",Helvetica,"Liberation Sans",sans-serif;
  --display:var(--serif);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101418; --surface:#1a1e22; --raise:#21262b; --sunk:#14181c; --ink:#eaecf0; --muted:#a2a9b1; --faint:#7a828a; --line:#353b42; --line-strong:#4b5158;
  --accent:#6b9bff; --accent-soft:#1c2a45; --accent-ink:#0b1630; --visited:#a48bff; --red:#ff7b72;
  --term:#14181c; --term-ink:#e0e4e8; --term-dim:#808890; --term-line:#3d5f86; --term-str:#e8c07d;
  --b1:#22324a; --b1bg:#161c26; --b1l:#34455e; --b2:#1f3a2e; --b2bg:#141d19; --b2l:#30513f; --b3:#33284a; --b3bg:#1a1622; --b3l:#48395f}}
:root[data-theme="dark"]{
  --bg:#101418; --surface:#1a1e22; --raise:#21262b; --sunk:#14181c; --ink:#eaecf0; --muted:#a2a9b1; --faint:#7a828a; --line:#353b42; --line-strong:#4b5158;
  --accent:#6b9bff; --accent-soft:#1c2a45; --accent-ink:#0b1630; --visited:#a48bff; --red:#ff7b72;
  --term:#14181c; --term-ink:#e0e4e8; --term-dim:#808890; --term-line:#3d5f86; --term-str:#e8c07d;
  --b1:#22324a; --b1bg:#161c26; --b1l:#34455e; --b2:#1f3a2e; --b2bg:#141d19; --b2l:#30513f; --b3:#33284a; --b3bg:#1a1622; --b3l:#48395f}
html{scroll-padding-top:12px}
body{font-size:.875rem;line-height:1.55}
.wk a{text-decoration:none}
.wk a:hover{text-decoration:underline}
.wk-page a:visited:not(.btn):not(.tab){color:var(--visited)}
.wk a.new,.wk a.new:visited{color:var(--red)}
.wk-prog{display:none}

/* шапка: простая светлая полоса с логотипом */
.wk-top{position:static;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line-strong);padding:10px 16px;min-height:0}
.wk>.cable{position:static}
.wk-top .wordmark{font-family:var(--serif);font-weight:400;font-size:1.6rem}
.tagline{font-style:italic}
.hbtn,.wk-search input{background:var(--surface);border-color:var(--line-strong)}
.wk-search{max-width:420px;margin-right:0}
.wk-top .topacts{margin-left:0}
.seg{border-color:var(--line-strong)}
kbd{border-radius:2px}

/* боковая панель: подписи и коробки со ссылками */
.wk-grid{max-width:none;grid-template-columns:200px minmax(0,1fr) 210px}
.wk-side,.wk-toc{top:0;max-height:100vh;padding:14px 10px 24px;gap:14px}
.wk-side{background:none;border-right:0;min-height:0}
.portlet h3{font-size:.76rem;font-weight:400;letter-spacing:0;text-transform:lowercase;color:var(--muted);padding:0 0 2px 6px;margin:0}
.portlet>ul,.portlet>ol{border:1px solid var(--line-strong);background:var(--surface);padding:5px 2px}
.portlet li a{font-size:.8rem;padding:2px 8px;color:var(--accent);border-radius:0}
.portlet li a:hover{background:none;text-decoration:underline}
.portlet li.on>a,.portlet li.on>.gh{background:none;color:var(--ink);font-weight:700}
.portlet li.on>.gh a{color:var(--ink)}
.portlet li a .i{display:none}
.portlet.note p{font-size:.72rem;padding:0 6px}
.tree .gh:hover,.tree .tw:hover{background:none}
.tree .gh a{font-weight:400}
.tree .tw{width:20px;height:22px}
.tree .tw .i{display:block}
.tree .grp>ul{margin:0 0 4px 10px;padding-left:4px;border-left:1px dotted var(--line-strong)}
.tree .grp>ul a{font-size:.76rem;color:var(--accent);padding:1px 6px}
.portlet li.sol-li a{color:var(--sol)}
.portlet li.sol-li a .i{display:block}
.toc{border-left:0}
.toc li a{border-left:0;margin-left:0;color:var(--accent);font-size:.78rem;padding:2px 8px}
.toc li.cur>a{color:var(--ink)}

/* вкладки и лист статьи */
.wk-art{padding:10px 8px 32px}
.crumbs{font-size:.76rem;margin-bottom:8px}
.wk-tabs{padding-left:12px;gap:4px}
.wk-tabs .tab{border:1px solid var(--line-strong);border-bottom:0;background:var(--raise);color:var(--accent);padding:4px 12px;font-weight:400;font-size:.82rem}
.wk-tabs a.tab:hover{background:var(--surface);text-decoration:none}
.wk-tabs .tab.on{background:var(--surface);color:var(--ink);font-weight:700;border-color:var(--line-strong);box-shadow:0 1px 0 var(--surface)}
.wk-tabs .tab.sol.on{box-shadow:0 1px 0 var(--surface)}
.wk-page{border:1px solid var(--line-strong);padding:16px 22px 22px;gap:12px}
.wk-hd{border-bottom:1px solid var(--line-strong);padding-bottom:2px;align-items:flex-end}
.wk-page h1{font-family:var(--serif);font-weight:400;font-size:1.85rem;letter-spacing:0;line-height:1.3}
.wk-acts{padding-bottom:4px;gap:10px}
.wk-acts .abtn{border:0;background:none;padding:0;color:var(--accent);font-weight:400;font-size:.76rem}
.wk-acts .abtn:hover{text-decoration:underline}
.wk-acts .abtn .i{width:13px;height:13px}
.wk-acts .abtn[aria-pressed="true"]{background:none;border:0;color:#b97a00}
.wk-sub{margin-top:-6px;font-size:.76rem}
.hatnote{border:0;background:none;padding:0 0 0 1.6em;font-style:italic;color:var(--ink);font-size:.84rem}
.wk-lead p{font-size:.9rem}
.wk-h2{font-family:var(--serif);font-weight:400;font-size:1.45rem;border-bottom:1px solid var(--line-strong);padding-bottom:1px;margin-top:10px}
.wk-h2 .num{font-family:var(--sans);font-size:.8rem;font-weight:400;color:var(--faint)}
.wk-h3{font-size:1rem}

/* таблицы, инфобокс, навигационные блоки */
.wikitable{font-size:.84rem;background:var(--raise)}
.wikitable th,.wikitable td{border:1px solid var(--line-strong);padding:4px 8px}
.wikitable th{background:var(--sunk);text-align:center;font-size:.84rem}
.wikitable tbody tr:hover td{background:none}
.mtag{border-radius:0;background:none;border:0;padding:0;font-size:.8rem;color:var(--ink);font-weight:700}
.mtag+.mtag::before{content:", ";font-weight:400}
.infobox{border:1px solid var(--line-strong);background:var(--raise)}
.infobox .ib-t{background:var(--b1);color:var(--ink);border-bottom:1px solid var(--line-strong);text-align:center;padding:5px 8px}
.infobox th,.infobox td{padding:3px 8px}
.catlinks{border:1px solid var(--line-strong);padding:5px 10px}
.catlinks a{border:0;background:none;padding:0;border-radius:0}
.catlinks a+a::before{content:"| ";color:var(--faint)}
.navbox{border:1px solid var(--line-strong)}
.navbox .nb-t{background:var(--b1);color:var(--ink)}
.navbox th{background:var(--sunk)}
.pager a{border:1px solid var(--line-strong);padding:6px 12px}
.pager a:hover{background:var(--raise);text-decoration:none}

/* заглавная: цветные рамки, как на порталах старых вики */
.hero{background:var(--b1bg);color:var(--ink);border:1px solid var(--b1l);padding:14px 18px;gap:2px;text-align:center;align-items:center}
.hero h2{font-family:var(--serif);font-weight:400;font-size:1.7rem}
.hero p{color:var(--ink);font-size:.92rem}
.hero p b{color:var(--ink)}
.portal-grid{gap:10px}
.portal-grid.two{grid-template-columns:minmax(0,55fr) minmax(0,45fr)}
.pbox{border:1px solid var(--b1l);background:var(--b1bg)}
.pbox h3{background:var(--b1);border:1px solid var(--b1l);margin:5px 5px 0;padding:3px 8px;font-size:.95rem}
.pbox.mod{border-top:1px solid var(--b1l)}
.pbox.b2,.pbox.mod{border-color:var(--b2l);background:var(--b2bg)}
.pbox.b2 h3,.pbox.mod h3{background:var(--b2);border-color:var(--b2l)}
.pbox .pb{padding:8px 12px 10px;flex:none}
.pbox.b2 .pb:last-child,.pbox:not(.b2) .pb{flex:1}
.pbox ol,.pbox ul,.pbox p{font-size:.86rem}
.facts{gap:6px!important}
.start li{border-radius:0}

/* код: пунктирная рамка, как <pre> в MediaWiki */
pre{font-size:.8rem;line-height:1.5}
.blk pre,.term{border:1px dashed var(--term-line);background:var(--term)}
.tbar{background:var(--raise);border-bottom:1px dashed var(--term-line)}
code{border-radius:0;background:var(--raise);border:1px solid var(--line)}
code[data-cp]{cursor:pointer;display:inline-block;word-break:break-word}
code[data-cp]:hover{border-color:var(--accent);background:var(--accent-soft)}
.chklist code{border:1px dashed var(--term-line)}
.msg{border:1px solid var(--line-strong);border-left-width:8px}

/* кнопки и поля: плоские серые */
.btn{box-shadow:none;background:var(--raise);border-color:var(--line-strong);font-weight:700;font-size:.82rem;padding:6px 12px}
.btn.ghost{font-weight:400}
.btn.primary,.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);filter:none}
.btn.big{padding:8px 16px;font-size:.9rem}
.seg button{border-radius:0}
.card,.toolbar,.lan,.send,details.fold{box-shadow:none}

/* кнопка «Решение» внизу главной, списки в статьях о Linux */
.solbtn{padding:7px 14px;font-size:.86rem;white-space:nowrap;text-decoration:none!important}
.sol-cta .btn.primary,.sol-cta .btn.primary:hover{background:var(--sol);border-color:var(--sol);color:#fff}
.sol-cta .solbtn{padding:5px 12px;font-size:.78rem}
.lxl{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:5px}
#main>p{margin:0;max-width:86ch}
.tree .gh a[data-twl]{color:var(--ink);font-weight:700}
.portlet li.sol-li.on>a{color:var(--sol)}
/* решения */
.sol-cta{border:1px solid var(--b2l);border-left:8px solid var(--ok);background:var(--b2bg)}
.sol-bar{position:static;border:1px solid var(--line-strong)}
.pg-bar{border-radius:0}
.step{border:1px solid var(--line-strong);border-left:8px solid var(--sol);padding:10px 14px 14px}
.step.done{border-left-color:var(--ok)}
.st-n{border-radius:0;width:24px;height:24px}
.vbsend{border:1px solid var(--b3l);background:var(--b3bg);padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:.8rem;min-width:0}
.vb-t{display:flex;flex-direction:column;gap:1px}
.vb-t span{color:var(--muted)}
.vb-r{display:flex;gap:8px;align-items:baseline;min-width:0}
.vb-r .mtag{flex:none;min-width:4.6em}
.vb-r code{flex:1;min-width:0;font-size:.76rem;padding:3px 8px;background:var(--surface)}
.totop{border-radius:0;box-shadow:none}
.wk-dlg,.pop,.wk-sug{box-shadow:2px 2px 0 var(--line-strong)}

@media (max-width:1240px){.wk-grid{grid-template-columns:200px minmax(0,1fr)}}
@media (max-width:900px){
  .wk-grid{grid-template-columns:minmax(0,1fr)}
  .wk-side{background:var(--bg);top:0;max-height:none;padding:14px 10px}
  .portal-grid.two{grid-template-columns:minmax(0,1fr)}
  .wk-search{max-width:none}
  .wk-page{padding:12px 12px 18px}
  .vb-r{flex-direction:column;gap:2px}
  .vb-r code{width:100%}
}
@media print{
  :root[data-wkprint] body>.wk{display:block!important}
  :root[data-wkprint] :is(.wk-top,.cable,.wk-side,.wk-toc,.wk-tabs,.crumbs,.wk-acts,.sol-bar,.pager,.st-ok,.lnk,.navbox,.anc,.hx){display:none!important}
  :root[data-wkprint] body{background:#fff}
  :root[data-wkprint] .wk-grid{display:block;max-width:none}
  :root[data-wkprint] .wk-art{padding:0}
  :root[data-wkprint] .wk-page{border:0;box-shadow:none;padding:0}

<script>
(function(){

// ---------- reference data ----------
const LEVELS={
  R:{name:'ДЭ 2026 · случайный',desc:'Структура КИМ 2026, но адреса, VLAN, порты, пароли и часовой пояс меняются от варианта к варианту'},
  D:{name:'ДЭ 2026',desc:'Задание 1 КИМ 09.02.06-1-2027: значения из текста экзамена, без случайных параметров'},
  E:{name:'Лёгкий',desc:'Как в демоверсии: ровные маски, стандартные логины и порты'},
  X:{name:'Экзамен',desc:'Случайные адреса, VLAN, порты, пароли и часовой пояс'},
  H:{name:'С подвохами',desc:'Подвохи на выбор: VLSM, «неровные» числа, IP-in-IP и другие'}
};
const TRAPS=[['vlsm','VLSM из общего блока'],['odd','«Неровные» числа адресов'],['ipip','Туннель IP-in-IP'],['m29','Маски /29 у провайдера и туннеля'],
  ['off','Сети провайдера и туннеля не с нуля'],['login','Свои логины'],['dom','Свой домен'],['docker','docker на стороне BR'],['ssh','Необычный порт и попытки SSH']];
const ALLTRAPS=(1<<TRAPS.length)-1;
const LANS=[['srv','HQ-SRV'],['cli','HQ-CLI'],['mgmt','сеть управления'],['br','BR-SRV']];
const TZ={'Europe/Kaliningrad':'калининградское время (UTC+2)','Europe/Moscow':'московское время (UTC+3)','Europe/Samara':'самарское время (UTC+4)',
  'Asia/Yekaterinburg':'екатеринбургское время (UTC+5)','Asia/Omsk':'омское время (UTC+6)','Asia/Novosibirsk':'новосибирское время (UTC+7)',
  'Asia/Krasnoyarsk':'красноярское время (UTC+7)','Asia/Irkutsk':'иркутское время (UTC+8)','Asia/Yakutsk':'якутское время (UTC+9)',
  'Asia/Vladivostok':'владивостокское время (UTC+10)','Asia/Magadan':'магаданское время (UTC+11)','Asia/Kamchatka':'камчатское время (UTC+12)'};
const DNSP=[['77.88.8.8','77.88.8.1'],['77.88.8.88','77.88.8.2'],['77.88.8.7','77.88.8.3'],['77.88.8.8','77.88.8.3']];
const BANNERS=['Authorized access only','Restricted area','Unauthorized access is prohibited','Authorized personnel only','Access is monitored'];
const PASS=['P@ssw0rd','P@$$word','Pa$$w0rd','Adm1n@2026','N3t@dm1n','S3cur3$Pass','Qwerty@123'];
const OSPFP=['P@ssw0rd','0spfKey26','Rout3Key','Ospf@Pass','Area0Key'];
const ADM=['rtr_admin','netadmin','net_adm','router_adm'];
const SU=['srv_user','remote_user','sshadmin','srv_admin'];
